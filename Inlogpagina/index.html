  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:            #f6f9ff;
      --card-bg:       #ffffff;
      --footer-bg:     #f2f4f4;
      --border:        #eceeee;
      --border-mid:    #bcc3ca;
      --blue:          #72a8f9;
      --blue-rgb:      78, 142, 243;
      --green:         #10a37f;
      --text:          #191c1d;
      --muted:         #6d747a;
      --error:         #ef4444;
      --font:          'Inria Sans', Georgia, serif;
      --r-card:        40px;
      --r-footer:      64px;
      --r-pill:        9999px;
      --shadow-card:   0 20px 25px -5px rgba(0,0,0,.10), 0 8px 10px -6px rgba(0,0,0,.10);
      --shadow-btn:    0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.10);
      --shadow-header: 0 4px 10px rgba(0,0,0,.03);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Page-level background decorations ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-layer::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 70%; height: 70%;
      background: radial-gradient(ellipse at top right,
        rgba(114,168,249,.20) 0%,
        transparent 60%);
    }
    .bg-layer::after {
      content: '';
      position: absolute;
      bottom: -100px; right: -100px;
      width: 600px; height: 600px;
      background: rgba(180,210,255,.18);
      border-radius: 50%;
      filter: blur(60px);
    }
    .bg-teal {
      position: fixed;
      top: -80px; left: -80px;
      width: 450px; height: 450px;
      background: rgba(150,200,240,.22);
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER – exact match to Mijn levensgebieden nav bar ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-header);
    }
    .header-inner {
      max-width: 1184px;
      margin: 0 auto;
      padding: 0 48px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      height: 48px;
      width: auto;
      display: block;
    }
    .header-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      color: rgba(109,116,122,.40);
    }
    .header-breadcrumb span.sep { font-weight: 400; }
    .header-breadcrumb span.active { color: var(--blue); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    /* Settings icon placeholder (matches the 20px icon in the spec) */
    .header-settings {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      opacity: .5;
    }
    /* Avatar – shown as empty/locked for login page */
    .header-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      opacity: .4;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 48px;
      position: relative;
      z-index: 1;
    }

    /* Floating educational decorations – positions set by JS */
    .edu-float {
      position: absolute;
      pointer-events: none;
      animation: drift 7s ease-in-out infinite;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0)   rotate(0deg);  }
      33%       { transform: translateY(-10px) rotate(2deg);  }
      66%       { transform: translateY(-6px)  rotate(-2deg); }
    }

    /* ── LOGIN CARD ── */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      animation: cardIn .5s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* Gradient accent stripe at top of card */
    .card-accent {
      height: 5px;
      background: linear-gradient(90deg,
        var(--blue) 0%,
        #a5c8ff 45%,
        var(--green) 100%);
    }

    .card-body {
      padding: 48px;
    }

    /* Icon cluster + badge */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .icon-cluster {
      display: flex;
      gap: 8px;
    }
    .edu-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .edu-icon--blue  { background: rgba(var(--blue-rgb),.10); }
    .edu-icon--green { background: rgba(16,163,127,.10); }
    .edu-icon--amber { background: rgba(245,158,11,.10); }

    .docent-badge {
      background: rgba(var(--blue-rgb),.10);
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: var(--r-pill);
    }

    /* Logo in card */
    .card-logo {
      height: 72px;
      width: auto;
      display: block;
      margin: 0 auto 32px;
    }

    /* Titles */
    .card-title {
      font-size: 48px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 40px;
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    .input-prefix {
      position: absolute;
      left: 18px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      display: flex; align-items: center;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 52px;
      padding: 0 18px 0 48px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text);
      background: #fff;
      transition: border-color .18s, box-shadow .18s;
      outline: none;
    }
    .form-input::placeholder { color: rgba(109,116,122,.45); }
    .form-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(var(--blue-rgb),.12);
    }
    .form-input.is-error {
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(239,68,68,.10);
    }

    /* Password visibility toggle */
    .pw-toggle {
      position: absolute;
      right: 16px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex; align-items: center;
      transition: color .18s;
    }
    .pw-toggle:hover { color: var(--text); }

    /* Options row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      margin-bottom: 32px;
    }

    .checkbox-label {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer;
      font-size: 14px; font-weight: 400;
      color: var(--muted);
      user-select: none;
    }
    .checkbox-label input[type="checkbox"] {
      appearance: none;
      width: 20px; height: 20px;
      border: 1.5px solid var(--border-mid);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: grid; place-content: center;
      transition: border-color .18s, background .18s;
    }
    .checkbox-label input[type="checkbox"]::before {
      content: '';
      width: 5px; height: 9px;
      margin-top: -2px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: scale(0) rotate(45deg);
      transition: transform .15s cubic-bezier(.22,.68,0,1.4);
    }
    .checkbox-label input[type="checkbox"]:checked {
      border-color: var(--blue);
      background: var(--blue);
    }
    .checkbox-label input[type="checkbox"]:checked::before { transform: scale(1) rotate(45deg); }

    .forgot-link {
      font-size: 14px; font-weight: 700;
      color: var(--blue);
      text-decoration: none;
      transition: opacity .18s;
      background: none; border: none; padding: 0; cursor: pointer;
      font-family: var(--font);
    }
    .forgot-link:hover { opacity: .65; }

    /* Wachtwoord-vergeten paneel */
    .forgot-panel { display: none; }
    .forgot-panel.actief { display: block; }
    .forgot-intro { font-size: 15px; color: var(--muted); line-height: 1.55; margin-bottom: 24px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: var(--muted);
      background: none; border: none; padding: 0; cursor: pointer;
      font-family: var(--font); margin-top: 18px; transition: color .18s;
    }
    .back-link:hover { color: var(--text); }

    /* Feedback messages */
    .form-msg {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px; line-height: 20px;
      margin-bottom: 20px;
    }
    .form-msg.is-error {
      display: flex;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.22);
      color: #b91c1c;
    }
    .form-msg.is-success {
      display: flex;
      background: rgba(16,163,127,.08);
      border: 1px solid rgba(16,163,127,.22);
      color: #065f46;
    }
    .form-msg svg { flex-shrink: 0; margin-top: 1px; }

    /* ── BUTTON ── */
    .btn-inloggen {
      width: 100%;
      height: 56px;
      background: var(--green);
      border: none;
      border-radius: var(--r-pill);
      font-family: var(--font);
      font-size: 20px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: var(--shadow-btn);
      position: relative;
      overflow: hidden;
    }
    .btn-inloggen::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: background .2s;
    }
    .btn-inloggen:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 20px -3px rgba(16,163,127,.30), 0 4px 6px -4px rgba(0,0,0,.10);
    }
    .btn-inloggen:hover:not(:disabled)::after { background: rgba(255,255,255,.08); }
    .btn-inloggen:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.10);
    }
    .btn-inloggen:disabled { opacity: .65; cursor: not-allowed; }

    /* Spinner inside button */
    .btn-spinner {
      display: none;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-label { display: flex; align-items: center; gap: 10px; }

    /* Loading state */
    .btn-inloggen.is-loading .btn-spinner { display: block; }
    .btn-inloggen.is-loading .btn-label  { display: none; }

    /* ── FOOTER – exact match to style-guide §7.19 ── */
    .site-footer {
      background: var(--footer-bg);
      border-radius: var(--r-footer) var(--r-footer) 0 0;
      padding: 40px 0;
      position: relative;
      z-index: 1;
    }
    .footer-inner {
      max-width: 1184px;
      margin: 0 auto;
      padding: 0 48px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    }
    .footer-logo { height: 48px; width: auto; }
    .footer-links { display: flex; gap: 32px; justify-content: center; }
    .footer-links a {
      font-size: 15px; font-weight: 400;
      color: var(--muted);
      text-decoration: none;
      transition: color .18s;
    }
    .footer-links a:hover { color: var(--blue); }
    .footer-copy {
      font-size: 16px; font-weight: 400;
      color: var(--muted);
      justify-self: end;
    }
  
    .ei { height: 1.15em; width: auto; object-fit: contain; vertical-align: -0.2em; display: inline-block; }
  </style>
</head>

  <script>
    /* ── Floating emoji placement: 2D grid + same-type adjacency fix ── */
    (function () {
      const COLS = 9, ROWS = 8;
      const cellW = 98 / COLS;
      const cellH = 94 / ROWS;

      /* Zigzag spatial order */
      const zigzag = [];
      for (let r = 0; r < ROWS; r++) {
        const row = Array.from({ length: COLS }, (_, c) => ({ r, c }));
        if (r % 2 === 1) row.reverse();
        zigzag.push(...row);
      }

      /* Planet size picker */
      const sizes   = [22, 26, 30, 34, 38, 42, 46, 50];
      const weights = [ 4,  4,  4,  3,  3,  2,  1,  1];
      const totalW  = weights.reduce((a, b) => a + b, 0);
      function pickSize() {
        let r = Math.random() * totalW;
        for (let k = 0; k < sizes.length; k++) { r -= weights[k]; if (r <= 0) return sizes[k]; }
        return sizes[0];
      }

      /* Get the emoji type key for a span */
      function typeOf(el) {
        const img = el.querySelector('img');
        return img ? img.getAttribute('src') : '__text__';
      }

      /* Are two grid cells adjacent (incl. diagonals)? */
      function adj(a, b) {
        return Math.abs(a.r - b.r) <= 1 && Math.abs(a.c - b.c) <= 1 && !(a.r === b.r && a.c === b.c);
      }

      /* Group spans by type, shuffle within each group */
      const floats  = Array.from(document.querySelectorAll('.edu-float'));
      const typeMap = new Map();
      floats.forEach(el => {
        const k = typeOf(el);
        if (!typeMap.has(k)) typeMap.set(k, []);
        typeMap.get(k).push(el);
      });
      typeMap.forEach(g => {
        for (let i = g.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [g[i], g[j]] = [g[j], g[i]];
        }
      });

      /* Interleave round-robin (most frequent type first) */
      const groups  = [...typeMap.values()].sort((a, b) => b.length - a.length);
      const ordered = [];
      const maxLen  = Math.max(...groups.map(g => g.length));
      for (let i = 0; i < maxLen; i++)
        for (const g of groups) if (i < g.length) ordered.push(g[i]);

      /* Initial cell assignment via zigzag */
      const N = zigzag.length;
      const n = ordered.length;
      const slots = ordered.map((el, i) => ({
        el,
        ...zigzag[Math.min(Math.floor(i * N / n), N - 1)]
      }));

      /* ── Post-process: swap out any same-type adjacent pairs ── */
      for (let iter = 0; iter < 500; iter++) {
        /* Find first violation */
        let vi = -1, vj = -1;
        outer: for (let i = 0; i < slots.length; i++) {
          for (let j = i + 1; j < slots.length; j++) {
            if (typeOf(slots[i].el) === typeOf(slots[j].el) && adj(slots[i], slots[j])) {
              vi = i; vj = j; break outer;
            }
          }
        }
        if (vi === -1) break; /* all clean */

        /* Try to fix by swapping slots[vi] with some slots[k] */
        const typeVi = typeOf(slots[vi].el);
        for (let k = 0; k < slots.length; k++) {
          if (k === vi || k === vj) continue;
          if (typeOf(slots[k].el) === typeVi) continue; /* same type, no help */

          const typeK = typeOf(slots[k].el);

          /* Would vi's new type (typeK) clash with vi's neighbours? */
          if (slots.some((s, si) => si !== vi && si !== k && adj(slots[vi], s) && typeOf(s.el) === typeK)) continue;

          /* Would k's new type (typeVi) clash with k's neighbours? */
          if (slots.some((s, si) => si !== vi && si !== k && adj(slots[k], s) && typeOf(s.el) === typeVi)) continue;

          /* Safe to swap */
          [slots[vi].el, slots[k].el] = [slots[k].el, slots[vi].el];
          break;
        }
      }

      /* Apply positions and styles */
      slots.forEach(({ el, r, c }) => {
        const jX      = 0.25 + Math.random() * 0.50;
        const jY      = 0.25 + Math.random() * 0.50;
        const left    = 1 + c * cellW + jX * cellW;
        const top     = 3 + r * cellH + jY * cellH;
        const size    = pickSize();
        const opacity = (0.12 + 0.26 * (size - 22) / (50 - 22)).toFixed(2);

        el.style.left           = left.toFixed(1) + '%';
        el.style.top            = top.toFixed(1) + '%';
        el.style.fontSize       = size + 'px';
        el.style.opacity        = opacity;
        el.style.animationDelay = (Math.random() * 7).toFixed(1) + 's';
      });
    })();
  </script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL      = 'https://cqcncausbclwvoomqdpy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxY25jYXVzYmNsd3Zvb21xZHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MjE3MDYsImV4cCI6MjA5NjI5NzcwNn0.Yh-5xrjxPW36OOufxbgu8CGiemDofFQ4R59Mmeomlwo';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ── Password toggle ─────────────────────────────────────────── */
    const pwField   = document.getElementById('password');
    const pwToggle  = document.getElementById('pwToggle');
    const eyeOpen   = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    pwToggle.addEventListener('click', () => {
      const hidden = pwField.type === 'password';
      pwField.type = hidden ? 'text' : 'password';
      eyeOpen.style.display   = hidden ? 'none' : '';
      eyeClosed.style.display = hidden ? ''     : 'none';
      pwToggle.setAttribute('aria-label', hidden ? 'Wachtwoord verbergen' : 'Wachtwoord tonen');
    });

    /* ── Form handling ───────────────────────────────────────────── */
    const form      = document.getElementById('loginForm');
    const btn       = document.getElementById('loginBtn');
    const msgEl     = document.getElementById('formMsg');
    const emailEl   = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const rememberEl = document.getElementById('rememberMe');

    /* ── Onthoud mij: e-mailadres lokaal onthouden ─────────────────── */
    const ONTHOUDEN_EMAIL_SLEUTEL = 'kvm_onthouden_email';
    const onthoudenEmail = localStorage.getItem(ONTHOUDEN_EMAIL_SLEUTEL);
    if (onthoudenEmail) {
      emailEl.value = onthoudenEmail;
      rememberEl.checked = true;
      passwordEl.focus();
    }

    const ICON_INFO = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>`;

    const ICON_CHECK = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

    function showMsg(type, text) {
      const icon = type === 'is-success' ? ICON_CHECK : ICON_INFO;
      msgEl.innerHTML = icon + '<span>' + text + '</span>';
      msgEl.className = 'form-msg ' + type;
    }

    function clearMsg() {
      msgEl.className = 'form-msg';
      msgEl.innerHTML = '';
    }

    function setLoading(on) {
      btn.classList.toggle('is-loading', on);
      btn.disabled     = on;
      emailEl.disabled = on;
      passwordEl.disabled = on;
    }

    function validate() {
      const email    = emailEl.value.trim();
      const password = passwordEl.value;

      emailEl.classList.remove('is-error');
      passwordEl.classList.remove('is-error');

      if (!email) {
        emailEl.classList.add('is-error');
        showMsg('is-error', 'Vul je e-mailadres in om verder te gaan.');
        emailEl.focus();
        return false;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailEl.classList.add('is-error');
        showMsg('is-error', 'Dit e-mailadres klopt niet. Controleer op typefouten (bijv. naam@school.nl).');
        emailEl.focus();
        return false;
      }

      if (!password) {
        passwordEl.classList.add('is-error');
        showMsg('is-error', 'Vul je wachtwoord in om in te loggen.');
        passwordEl.focus();
        return false;
      }

      if (password.length < 6) {
        passwordEl.classList.add('is-error');
        showMsg('is-error', 'Je wachtwoord moet minimaal 6 tekens bevatten.');
        passwordEl.focus();
        return false;
      }

      return true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg();

      if (!validate()) return;

      setLoading(true);

      const { error } = await supabase.auth.signInWithPassword({
        email:    emailEl.value.trim(),
        password: passwordEl.value,
      });

      if (error) {
        emailEl.classList.add('is-error');
        passwordEl.classList.add('is-error');
        showMsg('is-error', 'E-mailadres of wachtwoord is onjuist. Probeer het opnieuw of klik op "Wachtwoord vergeten?".');
        setLoading(false);
        emailEl.focus();
        return;
      }

      if (rememberEl.checked) {
        localStorage.setItem(ONTHOUDEN_EMAIL_SLEUTEL, emailEl.value.trim());
      } else {
        localStorage.removeItem(ONTHOUDEN_EMAIL_SLEUTEL);
      }

      showMsg('is-success', 'Inloggen gelukt! Je wordt doorgestuurd naar het dashboard…');
      setTimeout(() => { window.location.href = '/Dashboard'; }, 1400);
    });

    /* ── Wachtwoord vergeten ──────────────────────────────────────── */
    const loginView   = document.getElementById('loginView');
    const forgotPanel = document.getElementById('forgotPanel');
    const forgotLink  = document.getElementById('forgotLink');
    const backToLogin = document.getElementById('backToLogin');
    const forgotForm  = document.getElementById('forgotForm');
    const forgotEmailEl = document.getElementById('forgotEmail');
    const forgotMsgEl = document.getElementById('forgotMsg');
    const forgotBtn   = document.getElementById('forgotBtn');

    function toonForgotMsg(type, text) {
      const icon = type === 'is-success' ? ICON_CHECK : ICON_INFO;
      forgotMsgEl.innerHTML = icon + '<span>' + text + '</span>';
      forgotMsgEl.className = 'form-msg ' + type;
    }
    function wisForgotMsg() {
      forgotMsgEl.className = 'form-msg';
      forgotMsgEl.innerHTML = '';
    }
    function setForgotLoading(on) {
      forgotBtn.classList.toggle('is-loading', on);
      forgotBtn.disabled = on;
      forgotEmailEl.disabled = on;
    }

    forgotLink.addEventListener('click', () => {
      wisForgotMsg();
      forgotEmailEl.value = emailEl.value.trim();
      forgotEmailEl.classList.remove('is-error');
      loginView.style.display = 'none';
      forgotPanel.classList.add('actief');
      forgotEmailEl.focus();
    });

    backToLogin.addEventListener('click', () => {
      wisForgotMsg();
      forgotPanel.classList.remove('actief');
      loginView.style.display = '';
    });

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      wisForgotMsg();

      const email = forgotEmailEl.value.trim();
      forgotEmailEl.classList.remove('is-error');

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        forgotEmailEl.classList.add('is-error');
        toonForgotMsg('is-error', 'Vul een geldig e-mailadres in.');
        forgotEmailEl.focus();
        return;
      }

      setForgotLoading(true);

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/Inlogpagina/nieuw-wachtwoord.html'
      });

      setForgotLoading(false);

      if (error) {
        toonForgotMsg('is-error', 'Er ging iets mis: ' + error.message);
        return;
      }

      toonForgotMsg('is-success', 'Check je e-mail: als dit adres bekend is, ontvang je een link om een nieuw wachtwoord in te stellen.');
      forgotForm.querySelector('.form-input').disabled = true;
    });

    forgotEmailEl.addEventListener('input', () => {
      forgotEmailEl.classList.remove('is-error');
      wisForgotMsg();
    });

    /* Clear errors as the user types */
    [emailEl, passwordEl].forEach(el => {
      el.addEventListener('input', () => {
        el.classList.remove('is-error');
        if (!emailEl.classList.contains('is-error') && !passwordEl.classList.contains('is-error')) {
          clearMsg();
        }
      });
    });
  </script>
