<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen – Docentenportaal | Klaar voor Middelbaar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:            #f8fafa;
      --card-bg:       #ffffff;
      --footer-bg:     #f2f4f4;
      --border:        #eceeee;
      --border-mid:    #bcc3ca;
      --blue:          #72a8f9;
      --blue-rgb:      78, 142, 243;
      --green:         #10a37f;
      --text:          #191c1d;
      --muted:         #6d747a;
      --error:         #ef4444;
      --font:          'Inria Sans', Georgia, serif;
      --r-card:        40px;
      --r-footer:      64px;
      --r-pill:        9999px;
      --shadow-card:   0 20px 25px -5px rgba(0,0,0,.10), 0 8px 10px -6px rgba(0,0,0,.10);
      --shadow-btn:    0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.10);
      --shadow-header: 0 4px 10px rgba(0,0,0,.03);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Page-level background decorations ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-layer::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 65%; height: 65%;
      background: radial-gradient(ellipse at top right,
        rgba(163,197,248,.22) 0%,
        transparent 60%);
    }
    .bg-layer::after {
      content: '';
      position: absolute;
      bottom: -100px; right: -100px;
      width: 512px; height: 512px;
      background: rgba(215,227,255,.22);
      border-radius: 50%;
      filter: blur(50px);
    }
    .bg-teal {
      position: fixed;
      top: -80px; left: -80px;
      width: 384px; height: 384px;
      background: rgba(193,218,234,.28);
      border-radius: 50%;
      filter: blur(32px);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER – exact match to Mijn levensgebieden nav bar ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-header);
    }
    .header-inner {
      max-width: 1184px;
      margin: 0 auto;
      padding: 0 48px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      height: 48px;
      width: auto;
      display: block;
    }
    .header-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      color: rgba(109,116,122,.40);
    }
    .header-breadcrumb span.sep { font-weight: 400; }
    .header-breadcrumb span.active { color: var(--blue); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    /* Settings icon placeholder (matches the 20px icon in the spec) */
    .header-settings {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      opacity: .5;
    }
    /* Avatar – shown as empty/locked for login page */
    .header-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      opacity: .4;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 48px;
      position: relative;
      z-index: 1;
    }

    /* Floating educational decorations */
    .edu-float {
      position: absolute;
      pointer-events: none;
      font-size: 28px;
      opacity: .09;
      animation: drift 7s ease-in-out infinite;
    }
    .edu-float:nth-child(1) { top: 8%;  left: 7%;  animation-delay: 0s;   font-size: 32px; }
    .edu-float:nth-child(2) { top: 18%; right: 9%; animation-delay: 1.8s; font-size: 26px; }
    .edu-float:nth-child(3) { top: 52%; left: 4%;  animation-delay: 3.2s; font-size: 22px; }
    .edu-float:nth-child(4) { bottom: 22%; right: 7%; animation-delay: 0.9s; font-size: 30px; }
    .edu-float:nth-child(5) { bottom: 38%; left: 11%; animation-delay: 2.4s; font-size: 20px; }
    .edu-float:nth-child(6) { top: 65%; right: 14%; animation-delay: 4s;  font-size: 24px; }

    @keyframes drift {
      0%, 100% { transform: translateY(0)   rotate(0deg);  }
      33%       { transform: translateY(-10px) rotate(2deg);  }
      66%       { transform: translateY(-6px)  rotate(-2deg); }
    }

    /* ── LOGIN CARD ── */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      animation: cardIn .5s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* Gradient accent stripe at top of card */
    .card-accent {
      height: 5px;
      background: linear-gradient(90deg,
        var(--blue) 0%,
        #a5c8ff 45%,
        var(--green) 100%);
    }

    .card-body {
      padding: 48px;
    }

    /* Icon cluster + badge */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .icon-cluster {
      display: flex;
      gap: 8px;
    }
    .edu-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .edu-icon--blue  { background: rgba(var(--blue-rgb),.10); }
    .edu-icon--green { background: rgba(16,163,127,.10); }
    .edu-icon--amber { background: rgba(245,158,11,.10); }

    .docent-badge {
      background: rgba(var(--blue-rgb),.10);
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: var(--r-pill);
    }

    /* Titles */
    .card-title {
      font-size: 48px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 12px;
    }
    .card-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: var(--muted);
      line-height: 24px;
      margin-bottom: 40px;
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    .input-prefix {
      position: absolute;
      left: 18px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      display: flex; align-items: center;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 52px;
      padding: 0 18px 0 48px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text);
      background: #fff;
      transition: border-color .18s, box-shadow .18s;
      outline: none;
    }
    .form-input::placeholder { color: rgba(109,116,122,.45); }
    .form-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(var(--blue-rgb),.12);
    }
    .form-input.is-error {
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(239,68,68,.10);
    }

    /* Password visibility toggle */
    .pw-toggle {
      position: absolute;
      right: 16px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex; align-items: center;
      transition: color .18s;
    }
    .pw-toggle:hover { color: var(--text); }

    /* Options row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      margin-bottom: 32px;
    }

    .checkbox-label {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer;
      font-size: 14px; font-weight: 400;
      color: var(--muted);
      user-select: none;
    }
    .checkbox-label input[type="checkbox"] {
      appearance: none;
      width: 20px; height: 20px;
      border: 1.5px solid var(--border-mid);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: grid; place-content: center;
      transition: border-color .18s, background .18s;
    }
    .checkbox-label input[type="checkbox"]::before {
      content: '';
      width: 10px; height: 10px;
      border-radius: 3px;
      background: var(--blue);
      transform: scale(0);
      transition: transform .15s cubic-bezier(.22,.68,0,1.4);
    }
    .checkbox-label input[type="checkbox"]:checked {
      border-color: var(--blue);
      background: rgba(var(--blue-rgb),.08);
    }
    .checkbox-label input[type="checkbox"]:checked::before { transform: scale(1); }

    .forgot-link {
      font-size: 14px; font-weight: 700;
      color: var(--blue);
      text-decoration: none;
      transition: opacity .18s;
    }
    .forgot-link:hover { opacity: .65; }

    /* Feedback messages */
    .form-msg {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px; line-height: 20px;
      margin-bottom: 20px;
    }
    .form-msg.is-error {
      display: flex;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.22);
      color: #b91c1c;
    }
    .form-msg.is-success {
      display: flex;
      background: rgba(16,163,127,.08);
      border: 1px solid rgba(16,163,127,.22);
      color: #065f46;
    }
    .form-msg svg { flex-shrink: 0; margin-top: 1px; }

    /* ── BUTTON ── */
    .btn-inloggen {
      width: 100%;
      height: 56px;
      background: var(--green);
      border: none;
      border-radius: var(--r-pill);
      font-family: var(--font);
      font-size: 20px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: var(--shadow-btn);
      position: relative;
      overflow: hidden;
    }
    .btn-inloggen::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: background .2s;
    }
    .btn-inloggen:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 20px -3px rgba(16,163,127,.30), 0 4px 6px -4px rgba(0,0,0,.10);
    }
    .btn-inloggen:hover:not(:disabled)::after { background: rgba(255,255,255,.08); }
    .btn-inloggen:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.10);
    }
    .btn-inloggen:disabled { opacity: .65; cursor: not-allowed; }

    /* Spinner inside button */
    .btn-spinner {
      display: none;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-label { display: flex; align-items: center; gap: 10px; }

    /* Loading state */
    .btn-inloggen.is-loading .btn-spinner { display: block; }
    .btn-inloggen.is-loading .btn-label  { display: none; }

    /* ── FOOTER – exact match to style-guide §7.19 ── */
    .site-footer {
      background: var(--footer-bg);
      border-radius: var(--r-footer) var(--r-footer) 0 0;
      padding: 40px 48px;
      position: relative;
      z-index: 1;
    }
    .footer-inner {
      max-width: 1184px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo { height: 48px; width: auto; }
    .footer-links { display: flex; gap: 32px; }
    .footer-links a {
      font-size: 16px; font-weight: 700;
      color: var(--text);
      text-decoration: none;
      transition: opacity .18s;
    }
    .footer-links a:hover { opacity: .55; }
    .footer-copy {
      font-size: 16px; font-weight: 400;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- Page-level background layers -->
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-teal"  aria-hidden="true"></div>

  <!-- ══ HEADER ═══════════════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="header-inner">
      <img src="KvM logo no background.png" alt="Klaar voor Middelbaar" class="header-logo">

      <nav class="header-breadcrumb" aria-label="Navigatie">
        <span>Klaar voor Middelbaar</span>
        <span class="sep">/</span>
        <span class="active">Docentenportaal</span>
      </nav>

      <div class="header-right">
        <!-- Settings icon (20 px, matches spec) -->
        <div class="header-settings" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <!-- Avatar (locked / empty on login page) -->
        <div class="header-avatar" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="7" r="3.5" stroke="#bcc3ca" stroke-width="1.4"/>
            <path d="M2.5 16c0-3.5 3-5 6.5-5s6.5 1.5 6.5 5" stroke="#bcc3ca" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <!-- ══ MAIN ═════════════════════════════════════════════════════════ -->
  <main>
    <!-- Floating educational decorations -->
    <span class="edu-float" aria-hidden="true">📚</span>
    <span class="edu-float" aria-hidden="true">✏️</span>
    <span class="edu-float" aria-hidden="true">🎒</span>
    <span class="edu-float" aria-hidden="true">⭐</span>
    <span class="edu-float" aria-hidden="true">📖</span>
    <span class="edu-float" aria-hidden="true">🏫</span>

    <div class="login-card">
      <!-- Top gradient accent stripe -->
      <div class="card-accent" aria-hidden="true"></div>

      <div class="card-body">
        <!-- Icon cluster + badge -->
        <div class="card-top">
          <div class="icon-cluster" aria-hidden="true">
            <div class="edu-icon edu-icon--blue">📚</div>
            <div class="edu-icon edu-icon--green">✏️</div>
            <div class="edu-icon edu-icon--amber">⭐</div>
          </div>
          <span class="docent-badge">Docent</span>
        </div>

        <h1 class="card-title">Welkom</h1>
        <p class="card-subtitle">
          Log in om toegang te krijgen tot jouw lessen en<br>
          klasactiviteiten voor&nbsp;Groep&nbsp;8.
        </p>

        <form id="loginForm" novalidate>

          <!-- E-mailadres -->
          <div class="form-group">
            <label class="form-label" for="email">E-mailadres</label>
            <div class="input-wrap">
              <span class="input-prefix">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M2.5 4.5A1.5 1.5 0 0 1 4 3h10a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 14 15H4a1.5 1.5 0 0 1-1.5-1.5v-9Z"
                    stroke="currentColor" stroke-width="1.4"/>
                  <path d="M2.5 5.5 9 10l6.5-4.5"
                    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </span>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="naam@school.nl"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <!-- Wachtwoord -->
          <div class="form-group">
            <label class="form-label" for="password">Wachtwoord</label>
            <div class="input-wrap">
              <span class="input-prefix">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <rect x="3" y="8" width="12" height="8" rx="2"
                    stroke="currentColor" stroke-width="1.4"/>
                  <path d="M6 8V5.5a3 3 0 0 1 6 0V8"
                    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  <circle cx="9" cy="12" r="1.2" fill="currentColor"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Jouw wachtwoord"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                class="pw-toggle"
                id="pwToggle"
                aria-label="Wachtwoord tonen"
              >
                <!-- Eye open -->
                <svg id="eyeOpen" width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M9 4C5.5 4 2 9 2 9s3.5 5 7 5 7-5 7-5-3.5-5-7-5Z"
                    stroke="currentColor" stroke-width="1.4"/>
                  <circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/>
                </svg>
                <!-- Eye closed (hidden by default) -->
                <svg id="eyeClosed" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none">
                  <path d="M2 2l14 14M7.5 7.7A2.5 2.5 0 0 0 11.3 11M5.2 5.4C3.8 6.4 2.8 7.7 2 9c1.1 1.7 3.5 5 7 5 1.4 0 2.6-.5 3.6-1.2M9 4c3.5 0 5.9 3.3 7 5-.5.8-1.3 1.8-2.3 2.6"
                    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Opties rij: onthoud mij + wachtwoord vergeten -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span>Onthoud mij</span>
            </label>
            <a href="#" class="forgot-link">Wachtwoord vergeten?</a>
          </div>

          <!-- Fout / succes feedback -->
          <div class="form-msg" id="formMsg" role="alert" aria-live="polite"></div>

          <!-- Inloggen knop -->
          <button type="submit" class="btn-inloggen" id="loginBtn">
            <div class="btn-spinner" aria-hidden="true"></div>
            <span class="btn-label">
              <span>Inloggen</span>
              <svg width="19" height="16" viewBox="0 0 19 16" fill="none">
                <path d="M1 8h17M11 1.5l6.5 6.5L11 14.5"
                  stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

        </form>
      </div><!-- /card-body -->
    </div><!-- /login-card -->
  </main>

  <!-- ══ FOOTER ════════════════════════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="footer-inner">
      <img src="KvM logo no background.png" alt="Klaar voor Middelbaar" class="footer-logo">
      <nav class="footer-links" aria-label="Footer navigatie">
        <a href="#">Privacy</a>
        <a href="#">Contact</a>
      </nav>
      <p class="footer-copy">© 2026 Klaar voor Middelbaar</p>
    </div>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL      = 'https://cqcncausbclwvoomqdpy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxY25jYXVzYmNsd3Zvb21xZHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MjE3MDYsImV4cCI6MjA5NjI5NzcwNn0.Yh-5xrjxPW36OOufxbgu8CGiemDofFQ4R59Mmeomlwo';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ── Password toggle ─────────────────────────────────────────── */
    const pwField   = document.getElementById('password');
    const pwToggle  = document.getElementById('pwToggle');
    const eyeOpen   = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    pwToggle.addEventListener('click', () => {
      const hidden = pwField.type === 'password';
      pwField.type = hidden ? 'text' : 'password';
      eyeOpen.style.display   = hidden ? 'none' : '';
      eyeClosed.style.display = hidden ? ''     : 'none';
      pwToggle.setAttribute('aria-label', hidden ? 'Wachtwoord verbergen' : 'Wachtwoord tonen');
    });

    /* ── Form handling ───────────────────────────────────────────── */
    const form      = document.getElementById('loginForm');
    const btn       = document.getElementById('loginBtn');
    const msgEl     = document.getElementById('formMsg');
    const emailEl   = document.getElementById('email');
    const passwordEl = document.getElementById('password');

    const ICON_INFO = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>`;

    const ICON_CHECK = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

    function showMsg(type, text) {
      const icon = type === 'is-success' ? ICON_CHECK : ICON_INFO;
      msgEl.innerHTML = icon + '<span>' + text + '</span>';
      msgEl.className = 'form-msg ' + type;
    }

    function clearMsg() {
      msgEl.className = 'form-msg';
      msgEl.innerHTML = '';
    }

    function setLoading(on) {
      btn.classList.toggle('is-loading', on);
      btn.disabled     = on;
      emailEl.disabled = on;
      passwordEl.disabled = on;
    }

    function validate() {
      const email    = emailEl.value.trim();
      const password = passwordEl.value;

      emailEl.classList.remove('is-error');
      passwordEl.classList.remove('is-error');

      if (!email) {
        emailEl.classList.add('is-error');
        showMsg('is-error', 'Vul je e-mailadres in om verder te gaan.');
        emailEl.focus();
        return false;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailEl.classList.add('is-error');
        showMsg('is-error', 'Dit e-mailadres klopt niet. Controleer op typefouten (bijv. naam@school.nl).');
        emailEl.focus();
        return false;
      }

      if (!password) {
        passwordEl.classList.add('is-error');
        showMsg('is-error', 'Vul je wachtwoord in om in te loggen.');
        passwordEl.focus();
        return false;
      }

      if (password.length < 6) {
        passwordEl.classList.add('is-error');
        showMsg('is-error', 'Je wachtwoord moet minimaal 6 tekens bevatten.');
        passwordEl.focus();
        return false;
      }

      return true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg();

      if (!validate()) return;

      setLoading(true);

      const { error } = await supabase.auth.signInWithPassword({
        email:    emailEl.value.trim(),
        password: passwordEl.value,
      });

      if (error) {
        emailEl.classList.add('is-error');
        passwordEl.classList.add('is-error');
        showMsg('is-error', 'E-mailadres of wachtwoord is onjuist. Probeer het opnieuw of klik op "Wachtwoord vergeten?".');
        setLoading(false);
        emailEl.focus();
        return;
      }

      showMsg('is-success', 'Inloggen gelukt! Je wordt doorgestuurd naar het dashboard…');
      setTimeout(() => { window.location.href = '../Dashboard/dashboard.html'; }, 1400);
    });

    /* Clear errors as the user types */
    [emailEl, passwordEl].forEach(el => {
      el.addEventListener('input', () => {
        el.classList.remove('is-error');
        if (!emailEl.classList.contains('is-error') && !passwordEl.classList.contains('is-error')) {
          clearMsg();
        }
      });
    });
  </script>
</body>
</html>
