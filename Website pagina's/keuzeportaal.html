<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klaar voor Middelbaar</title>
  <link rel="icon" href="favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#191c1d;--muted:#6d747a;--blue:#72a8f9;--blue-dark:#4e8ef3;--green:#10a37f;--line:#e6ebef}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Inria Sans',sans-serif;color:var(--ink)}
    body{min-height:100vh;background:#f6f9ff;overflow:hidden;position:relative}
    body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top right,rgba(114,168,249,.2),transparent 60%),radial-gradient(circle at bottom left,rgba(150,200,240,.2),transparent 42%);pointer-events:none}
    .dots{position:fixed;inset:0;opacity:.42;background-image:radial-gradient(rgba(78,142,243,.2) 1.5px,transparent 1.5px);background-size:28px 28px;pointer-events:none}
    .topbar{height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 48px;border-bottom:1px solid rgba(220,228,236,.8);position:relative;z-index:1}
    .brand img{height:48px;width:auto;display:block}.top-label{color:var(--blue);font-weight:700;font-size:16px}
    .card{position:relative;z-index:1;width:min(100% - 40px,720px);margin:clamp(42px,10vh,100px) auto 0;background:#fff;border:1px solid #eceeee;border-radius:40px;box-shadow:0 22px 50px rgba(30,74,138,.14);padding:5px 56px 56px;text-align:center;overflow:hidden}
    .card:before{content:'';display:block;height:5px;margin:0 -56px 44px;background:linear-gradient(90deg,var(--blue),#a5c8ff 45%,var(--green))}
    .card-logo{height:72px;width:auto;margin:0 auto 30px;display:block}.card h1{font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0 0 14px;letter-spacing:-.6px}.card>p{max-width:500px;margin:0 auto 34px;color:var(--muted);font-size:19px;line-height:1.5}
    .role-label{display:block;text-align:left;font-size:22px;font-weight:700;margin:0 0 8px}.role-switch{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--green);border-radius:14px;overflow:hidden;margin-bottom:26px}.role-switch button{border:0;background:#fff;color:var(--green);font:inherit;font-size:21px;padding:14px 10px;cursor:pointer}.role-switch button.active{background:var(--green);color:#fff}.role-panel{padding:24px;border-radius:20px;background:#f7fbff;border:1px solid #e5eef8;text-align:left}.role-panel.parent{background:#fffaf0;border-color:#f4e6bd}.role-panel h2{margin:0 0 8px;font-size:25px}.role-panel p{margin:0 0 20px;color:var(--muted);line-height:1.5}.role-link{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:18px;box-shadow:0 10px 18px rgba(16,163,127,.2)}.role-link:hover,.role-link:focus-visible{background:#0d8f70;outline:3px solid rgba(16,163,127,.2);outline-offset:3px}
    @media(max-width:640px){body{overflow:auto}.topbar{padding:0 20px}.card{margin:32px 20px 40px;width:auto;border-radius:26px;padding:5px 24px 28px}.card:before{margin:0 -24px 30px}.card-logo{height:60px;margin-bottom:26px}.card>p{font-size:17px;margin-bottom:26px}.role-switch button{font-size:19px;padding:13px 8px}.role-panel{padding:20px}}
    .code-form{display:flex;gap:10px}.code-form input{flex:1;min-width:0;height:52px;border:1.5px solid #dfe8ee;border-radius:14px;padding:0 16px;font:inherit;text-transform:uppercase;letter-spacing:1px;color:var(--ink)}.code-form button{border:0;border-radius:999px;padding:0 22px;background:var(--green);color:#fff;font:700 16px inherit;cursor:pointer}.code-error{margin:12px 0 0;color:#b91c1c;font-size:14px;font-weight:600}
    .role-panel h2{display:none}.login-fields{display:grid;gap:18px}.login-fields label{display:grid;gap:8px;font-weight:700}.login-fields input{height:54px;border:1.5px solid #e5e8ea;border-radius:16px;padding:0 16px;font:inherit;color:var(--ink)}
    @media(prefers-reduced-motion:reduce){.choice{transition:none}}
  </style>
</head>
<body>
  <div class="dots" aria-hidden="true"></div>
  <header class="topbar"><a class="brand" href="/" aria-label="Klaar voor Middelbaar"><img src="Dashboard/KvM%20logo%20no%20background.png" alt="Klaar voor Middelbaar"></a><span class="top-label">Kies je omgeving</span><span aria-hidden="true"></span></header>
  <main class="card">
    <img class="card-logo" src="Dashboard/KvM%20logo%20no%20background.png" alt="Klaar voor Middelbaar">
    <h1>Welkom bij Klaar voor Middelbaar</h1>
    <p>Waar wil je naartoe?</p>
    <label class="role-label" for="role-parent">Ik ben</label>
    <div class="role-switch" role="group" aria-label="Kies je rol"><button type="button" class="active" id="role-teacher">Leerkracht</button><button type="button" id="role-parent">Ouder/verzorger</button></div>
    <section class="role-panel" id="teacher-panel"><p>Log in op de leeromgeving voor lessen, materialen en voorbereiding.</p><div class="login-fields"><label>E-mailadres<input type="email" placeholder="naam@school.nl"></label><label>Wachtwoord<input type="password" placeholder="Jouw wachtwoord"></label><a class="role-link" href="Inlogpagina/" target="_blank" rel="noopener">Inloggen →</a></div></section>
    <section class="role-panel parent" id="parent-panel" hidden><p>Vul de toegangscode van je klas in om het ouderportaal te openen.</p><form class="code-form" id="parentCodeForm"><input id="parentCode" placeholder="JOUW TOEGANGSCODE" autocomplete="off" required><button type="submit">Naar mijn klas</button></form><p class="code-error" id="codeError" hidden>Deze code herken ik niet. Controleer de code en probeer opnieuw.</p></section>
  </main>
  <script>
    const teacherButton=document.querySelector('#role-teacher'),parentButton=document.querySelector('#role-parent'),teacherPanel=document.querySelector('#teacher-panel'),parentPanel=document.querySelector('#parent-panel');
    function selectRole(parent){teacherButton.classList.toggle('active',!parent);parentButton.classList.toggle('active',parent);teacherPanel.hidden=parent;parentPanel.hidden=!parent}
    teacherButton.addEventListener('click',()=>selectRole(false));parentButton.addEventListener('click',()=>selectRole(true));
    document.querySelector('#parentCodeForm').addEventListener('submit',event=>{event.preventDefault();const ok=document.querySelector('#parentCode').value.trim().toUpperCase()==='8A-KVM';if(ok){window.location.href='/ouderportaal'}else document.querySelector('#codeError').hidden=false});
  </script>
</body>
</html>
