  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:'Inria Sans',sans-serif;background:#f4f8fd;background-image:radial-gradient(rgba(78,142,243,.08) 1.5px,transparent 1.5px),radial-gradient(ellipse at 100% 0,rgba(114,168,249,.24),transparent 38%),radial-gradient(ellipse at 0 100%,rgba(16,163,127,.08),transparent 34%);background-size:28px 28px,100% 100%,100% 100%}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.page{max-width:1184px;margin:auto;padding:0 32px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:700;font-size:18px}.brand img{width:46px;height:46px;object-fit:contain}.top-tag{color:var(--blue-dark);font-weight:700;font-size:16px}.login-shell{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:40px 0 80px}.login-card{width:min(100%,560px);background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:40px;padding:46px;box-shadow:0 28px 70px rgba(30,74,138,.16);text-align:center}.spark{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 24px;border-radius:24px;background:linear-gradient(145deg,#72a8f9,#4e8ef3);color:#fff;font-size:38px;box-shadow:0 12px 24px rgba(78,142,243,.3)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,5vw,48px);line-height:1.05;margin-bottom:14px;letter-spacing:-.8px}.login-card>p{font-size:19px;line-height:1.5;color:var(--muted);max-width:420px;margin:0 auto 30px}.code-form{display:flex;gap:10px;max-width:420px;margin:auto}.code-form input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:15px 18px;outline:0;text-align:center;text-transform:uppercase;letter-spacing:2px;color:var(--blue-dark);font-weight:700;background:#fbfdff}.code-form input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(78,142,243,.12)}.primary{border:0;border-radius d:#e7f7f2;border-color:#d2eee5}.summary h2{color:#08705a}.summary p{font-size:17px;line-height:1.55;margin:0}.content-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:24px;margin-top:24px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.85);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}.card h2{font-size:25px;margin-bottom:8px}.card-intro{color:var(--muted);margin-bottom:22px;line-height:1.5}.insights{display:grid;gap:12px;padding:0;margin:0;list-style:none}.insights li{display:flex;gap:13px;align-items:flex-start;line-height:1.45}.insights li:before{content:'✓';display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:50%;background:#e6f7f1;color:var(--green);font-weight:700}.kitchen{background:var(--cream);border-color:#f4e6bd}.kitchen h2{color:#8b5a16}.questions{display:grid;gap:11px;margin-top:22px}.question{padding:15px 16px;border-radius:17px;background:rgba(255,255,255,.78);color:#5b4d38;line-height:1.4}.question span{color:var(--coral);font-weight:700;margin-right:8px}.tip{margin-top:24px;background:#e7f7f2;border-color:#d2eee5}.tip h2{color:#08705a}.tip p{font-size:17px;line-height:1.55;margin:0}.history{margin-top:24px}.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.history-header h2{margin:0}.history small{color:var(--muted)}.lesson-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson-btn{text-align:left;border:1px solid color-mix(in srgb,var(--lesson-end) 28%,#e2e9f0);background:color-mix(in srgb,var(--lesson-end) 10%,#fff);border-radius:18px;padding:16px;min-height:112px;color:var(--ink);transition:transform .2s,border-color .2s,background .2s}.lesson-btn:hover{transform:translateY(-2px);border-color:var(--lesson-end);background:color-mix(in srgb,var(--lesson-end) 22%,#fff)}.lesson-btn.active{transform:translateY(-2px);border:3px solid var(--lesson-end);background:color-mix(in srgb,var(--lesson-end) 22%,#fff);padding:14px}.lesson-btn strong{display:block;color:var(--lesson-start);margin-bottom:8px}.lesson-btn span{display:block;line-height:1.35}.lesson-btn time{display:block;color:var(--muted);font-size:13px;margin-top:8px}.status-note{margin-top:18px;color:var(--muted);font-size:13px}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}:focus-visible{outline:3px solid rgba(78,142,243,.45);outline-offset:3px}@media(max-width:760px){.page{padding:0 18px}.topbar{height:68px}.top-tag{font-size:14px}.login-card{padding:34px 22px;border-radius:30px}.code-form{flex-direction:column}.code-form input,.code-form .primary{width:100%}.welcome{align-items:flex-start;flex-direction:column;padding:28px 0 22px}.hero{grid-template-columns:1fr;padding:28px;border-radius:28px}.hero h2{font-size:29px;max-width:calc(100% - 120px)}.hero:after{width:120px;height:150px;right:8px;left:auto;top:50%;bottom:auto;transform:translateY(-50%)}.lesson-meta{text-align:left;justify-self:start}.lesson-number{font-size:48px}.content-grid{grid-template-columns:1fr}.card{padding:24px;border-radius:24px}.lesson-list{grid-template-columns:1fr 1fr}}@media(max-width:440px){.lesson-list{grid-template-columns:1fr}.brand{font-size:16px}.brand img{width:40px;height:40px}}

  <style>
    /* De oudercode-inlog volgt exact de docent-inlogstijl. */
    body{background-color:#f6f9ff;background-image:none;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
    main.page{width:100%;max-width:none;padding:0}
    .topbar{position:sticky;top:0;z-index:20;height:72px;background:#f6f9ff;border-bottom:1px solid #eceeee;box-shadow:0 4px 10px rgba(0,0,0,.03);padding:0 48px;max-width:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
    .topbar:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at top right,rgba(114,168,249,.2),transparent 60%)}
    .brand,.top-tag,.header-logout{position:relative;z-index:1}.brand img{height:48px;width:auto}.brand span{display:none}.top-tag{font-size:16px;color:#72a8f9;font-weight:700;justify-self:center}.header-logout{justify-self:end;border:1px solid rgba(114,168,249,.45);background:#fff;color:#4e8ef3;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px}

    .edu-float{position:absolute;z-index:1;pointer-events:none;animation:portalDrift 7s ease-in-out infinite}.edu-float .ei{height:1.15em;width:auto;object-fit:contain;vertical-align:-.2em;display:inline-block}@keyframes portalDrift{0%,100%{transform:translateY(0) rotate(0)}33%{transform:translateY(-10px) rotate(2deg)}66%{transform:translateY(-6px) rotate(-2deg)}}
    .login-card{position:relative;z-index:2;width:min(100%,520px);max-width:520px;border:1px solid #eceeee;border-radius:40px;background:#fff;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);padding:0;overflow:hidden;text-align:left}

    .spark{display:none}.portal-card-logo{display:block;height:72px;width:auto;margin:0 auto 32px}.login-card h1{font-size:clamp(30px,7vw,38px);line-height:1;margin:0 0 32px;color:#191c1d;letter-spacing:0}
    .code-form{display:block;max-width:none;margin-top:26px}.code-form input{width:100%;height:52px;padding:0 18px;border:1.5px solid #eceeee;border-radius:16px;text-align:left;text-transform:none;letter-spacing:0;font-size:16px;color:#191c1d;background:#fff;margin-bottom:20px}
    .code-form input:focus{border-color:#72a8f9;box-shadow:0 0 0 4px rgba(78,142,243,.12)}
    .code-form input::placeholder{color:rgba(109,116,122,.45)}

    .app-shell{position:relative;z-index:1}.topbar+main{position:relative;z-index:1}
    /* Alleen de inlogachtergrond is viewport-breed; de portalinhoud blijft gecentreerd. */

    @media(max-width:760px){#login.login-shell{inset:68px 0 0;height:calc(100vh - 68px);padding:40px 20px;}#login.login-shell .login-card{width:100%;max-width:520px;}.hero:after{width:108px;height:135px;top:50%;transform:translateY(-50%);}}

<body>
  <header class="topbar"><a class="brand" href="../Homepagina-Groep8.html"><img src="../Dashboard/KvM%20logo%20no%20background.png" alt="Klaar voor Middelbaar"></a><span class="top-tag">Ouderportaal</span><button id="logout" class="header-logout hidden" type="button">Uitloggen</button></header>
  <main class="page">
    <section id="login" class="login-shell">
      <div class="login-card">
        <img class="portal-card-logo" src="../Dashboard/KvM%20logo%20no%20background.png" alt="Klaar voor Middelbaar">
        <h1>Ouderportaal</h1>
        <p>Ontdek wat jouw kind heeft geleerd en praat er thuis samen over door.</p>
        <form class="code-form" id="loginForm"><label class="hidden" for="accessCode">Toegangscode</label><input id="accessCode" placeholder="JOUW TOEGANGSCODE" autocomplete="off" required><button class="primary" type="submit">Naar mijn klas</button></form>
        <p class="demo-note">Voor deze demo is de toegangscode <strong>8A-KVM</strong>.</p><p id="loginError" class="error hidden" role="alert">Deze code herken ik niet. Controleer de code en probeer opnieuw.</p>

      <div class="welcome"></div>
      <div id="lessonView" class="fade"></div>
      <div class="bottom-actions"></div>
    </section>
  </main>
  <script>
    (function(){
      const names=['boeken','pen','rugzak','ster','openboek','school','pen','driehoek','driehoek','sleutel','lijst','planeet','pen','pen','planeet','sleutel','planeet','lamp','trofee','sleutel','lijst','raket','pen','lijst','pen','lijst','brein','raket','raket','trofee','notitieboek','vulpen','sleutel','raket','vraagteken','planeet','lijst','vinkje','sleutel','openboek','ster','sleutel','planeet','raket','planeet','raket','raket','planeet','planeet','vraagteken','planeet','raket','sleutel','vraagteken','notitieboek','sleutel','planeet','raket','ster','trofee','planeet','klok','kinderen','balpen','envelop','slot','klok','balpen','envelop','slot'];
      const shell=document.querySelector('.login-shell'),card=shell.querySelector('.login-card');
      names.forEach(name=>{const el=document.createElement('span');el.className='edu-float';el.setAttribute('aria-hidden','true');const img=document.createElement('img');img.className='ei';img.src='../Afbeeldingen/emojis%20nieuw/'+name+'.png';img.alt='';el.appendChild(img);shell.insertBefore(el,card)});
      const COLS=9,ROWS=8,cellW=98/COLS,cellH=94/ROWS,zigzag=[];
      for(let r=0;r<ROWS;r++){const row=Array.from({length:COLS},(_,c)=>({r,c}));if(r%2)row.reverse();zigzag.push(...row)}
      const sizes=[22,26,30,34,38,42,46,50],weights=[4,4,4,3,3,2,1,1],totalW=weights.reduce((a,b)=>a+b,0);
      function pickSize(){let r=Math.random()*totalW;for(let i=0;i<sizes.length;i++){r-=weights[i];if(r<=0)return sizes[i]}return sizes[0]}
      function typeOf(el){return el.querySelector('img')?.getAttribute('src')||'__text__'}
      function adj(a,b){return Math.abs(a.r-b.r)<=1&&Math.abs(a.c-b.c)<=1&&!(a.r===b.r&&a.c===b.c)}
      const floats=Array.from(shell.querySelectorAll('.edu-float')),map=new Map();floats.forEach(el=>{const k=typeOf(el);if(!map.has(k))map.set(k,[]);map.get(k).push(el)});
      map.forEach(g=>{for(let i=g.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[g[i],g[j]]=[g[j],g[i]]}});
      const groups=[...map.values()].sort((a,b)=>b.length-a.length),ordered=[],maxLen=Math.max(...groups.map(g=>g.length));for(let i=0;i<maxLen;i++)for(const g of groups)if(i<g.length)ordered.push(g[i]);
      const N=zigzag.length,n=ordered.length,slots=ordered.map((el,i)=>({el,...zigzag[Math.min(Math.floor(i*N/n),N-1)]}));
      for(let iter=0;iter<500;iter++){let vi=-1,vj=-1;outer:for(let i=0;i<slots.length;i++)for(let j=i+1;j<slots.length;j++)if(typeOf(slots[i].el)===typeOf(slots[j].el)&&adj(slots[i],slots[j])){vi=i;vj=j;break outer}if(vi<0)break;const typeVi=typeOf(slots[vi].el);for(let k=0;k<slots.length;k++){if(k===vi||k===vj||typeOf(slots[k].el)===typeVi)continue;const typeK=typeOf(slots[k].el);if(slots.some((s,si)=>si!==vi&&si!==k&&adj(slots[vi],s)&&typeOf(s.el)===typeK))continue;if(slots.some((s,si)=>si!==vi&&si!==k&&adj(slots[k],s)&&typeOf(s.el)===typeVi))continue;[slots[vi].el,slots[k].el]=[slots[k].el,slots[vi].el];break}}
      slots.forEach(({el,r,c})=>{const left=1+c*cellW+(0.25+Math.random()*.5)*cellW,top=3+r*cellH+(0.25+Math.random()*.5)*cellH,size=pickSize();el.style.left=left.toFixed(1)+'%';el.style.top=top.toFixed(1)+'%';el.style.fontSize=size+'px';el.style.opacity=(.12+.26*(size-22)/(50-22)).toFixed(2);el.style.animationDelay=(Math.random()*7).toFixed(1)+'s'});
    })();
    const lessons=[
      {n:1,g1:'#1e4a8a',g2:'#72a8f9',title:'Klaar voor lancering!',sub:'Kennismaking + Slim Leren',date:'10 januari 2026',insights:['Je kind weet beter wat het kan verwachten van de brugklas.','Je kind weet wat Klaar voor Middelbaar is en wat er nog gaat komen.','Je kind ontdekt dat slim leren meer is dan alleen hard werken.'],summary:'De leerlingen maken kennis met het programma. Ze leren dat slim leren net zo belangrijk is als hard werken. In tweetallen spelen ze het kaartspel Kraak de Code: ze beantwoorden vragen en kraken samen een code. De winnaars krijgen stressballen. Aan het einde doen ze een quiz.',questions:['Wat betekent \'slim leren\' volgens jou?','Welke slim leren tips zijn je bijgebleven?','Heb je het spel Kraak de Code gewonnen, en met wie speelde je?']},
      {n:2,g1:'#065f46',g2:'#10a37f',title:'Middelbare schoolweek inplannen',sub:'Kennismaken met het KvM Planning Stappenplan',date:'17 januari 2026',insights:['Je kind kent het verschil tussen een agenda en een planning.','Je kind kan werken met de KvM Plagenda.','Je kind kent de vier stappen van het KvM Planning Stappenplan.'],summary:'De leerlingen leren het ‘KvM Planning Stappenplan’: vier stappen om goed te plannen. Daarmee plannen ze in tweetallen een hele schoolweek in hun werkboek. Wie klaar is, speelt het spel Planeten Planner.',questions:['Wat zijn de tips die je hebt gekregen voor het maken van een goede planning op de middelbare?','Hoe vond je het om de middelbare schoolweek in te plannen?']},
      {n:3,g1:'#92400e',g2:'#f59e0b',title:'Hulpmiddelen tijdens het leren',sub:'Handige digitale tools voor op school',date:'24 januari 2026',insights:['Je kind kent de Slim Leren-tips beter.','Je kind weet wat het kan doen als het iets niet begrijpt.','Je kind kan verschillende online hulpmiddelen bij het leren benoemen.'],summary:'De leerlingen voltooien tijdens deze les in tweetallen drie missies. Ze ontdekken welke hulpmiddelen je kunt gebruiken als je iets niet snapt, zoals uitlegvideo’s, woordjes leren en AI.',questions:['Weet je nog welke 3 missies je tijdens de les hebt gedaan?','Welk hulpmiddel denk je dat je het meest gaat gebruiken op de middelbare school?','Hoe zou jij AI gebruiken op de middelbare school, en wat zijn de gevaren daarvan?']},
      {n:4,g1:'#4c1d95',g2:'#7c3aed',title:'Executieve functies',sub:'Vaardigheden voor school en daarbuiten',date:'31 januari 2026',insights:['Je kind weet wat executieve functies zijn.','Je kind herkent de eigen sterkste en minst sterke executieve functies.','Je kind oefent deze vaardigheden tijdens KvM Sterrenstrijd.'],summary:'De leerlingen vullen een lijst met stellingen in en ontdekken zo hun sterkste en minst sterke executieve functie (zoals plannen of doorzetten). Daarna oefenen ze dit in groepjes van 4 met het bordspel KvM SterrenStrijd.',questions:['Hoe vond je het spel KvM SterrenStrijd? Met wie zat je in het groepje?','Wat was je sterkste en je minst sterke executieve functie?']},
      {n:5,g1:'#7f1d1d',g2:'#e05545',title:'Omgaan met toetsen en stress',sub:'Zelfverzekerd naar een toets toewerken',date:'7 februari 2026',insights:['Je kind weet hoe het zich op een toets kan voorbereiden.','Je kind weet hoe het een toets slim kan maken en achteraf kan bekijken.','Je kind kent gezonde manieren om met stress om te gaan.'],summary:'De leerlingen verzamelen tips voor het maken van een toets. Daarna maken ze de KvM Toets, met een addertje onder het gras bij de laatste vraag: je moet eerst de hele toets lezen. Ook beantwoorden ze anoniem vragen over stress bij KlasKompas. Dit vormt de basis voor een gesprek in de klas.',questions:['Ik hoorde dat een groot deel van de klas in de maling was genomen tijdens de les — hoe ging de toets bij jou?','Hoe ging het klassengesprek over stress op de middelbare school?','Welke tips voor het maken van een toets en het omgaan met stress vond je zelf het belangrijkste van de les?']},
      {n:6,g1:'#0c4a6e',g2:'#0284c7',title:'Drukke schoolweek inplannen',sub:'Een volle week plannen met het KvM Planning Stappenplan',date:'14 februari 2026',insights:['Je kind kan een drukke middelbare schoolweek inplannen.','Je kind kent het KvM Planning Stappenplan nog beter.','Je kind ervaart dat op tijd plannen loont.'],summary:'Dit is een herhaling van les 2. De leerlingen plannen nu zelfstandig een extra drukke schoolweek. Wie klaar is, speelt weer Planeten Planner. Het highscorebord van les 2 wordt aangevuld.',questions:['Dit was je tweede keer plannen — merkte je dat het beter ging dan de vorige keer?','Sta jij al op het highscorebord van Planeten Planner?']},
      {n:7,g1:'#831843',g2:'#db2777',title:'Schriftelijke vaardigheden',sub:'Mailen naar je leerkracht en aantekeningen maken',date:'21 februari 2026',insights:['Je kind begrijpt het verschil tussen informeel en formeel taalgebruik.','Je kind kan een formele e-mail aan een leerkracht schrijven.','Je kind kan overzichtelijke aantekeningen maken tijdens een les.'],summary:'De leerlingen schrijven een informele mail om naar een formele mail, aan een docent. Ook oefenen ze met het maken van aantekeningen tijdens een echte aardrijkskundeles.',questions:['Hoe begin en eindig je een formele mail naar je docent?','Vind je het spannend om een mail te sturen naar een leerkracht? Waarom wel of niet?','Welke tips heb je onthouden voor het maken van aantekeningen?']},
      {n:8,g1:'#134e4a',g2:'#0f766e',title:'Klaar voor de start!',sub:'Afsluiten, evalueren en certificaat in ontvangst nemen',date:'28 februari 2026',insights:['Je kind test alles wat het heeft geleerd met KvM RuimteRace.','Je kind denkt na over wat goed ging en wat beter kan in het programma.','Je kind rondt het programma af met een certificaat en een persoonlijke terugblik.'],summary:'Dit is de laatste les. De leerlingen spelen in groepjes het bordspel KvM RuimteRace. Ze vullen een enquête in met tips en tops over het programma. Tot slot krijgen ze een Survivalgids en een certificaat mee naar huis.',questions:['Met wie speelde je KvM RuimteRace, en wie won er in jouw groepje?','Wat vond je van het Klaar voor Middelbaar-programma?','Heb je je Survivalgids en je certificaat al mee naar huis genomen?']}
    ];
    const $=s=>document.querySelector(s); let current=2;
    function render(n){const l=lessons[n]; document.documentElement.style.setProperty('--lesson-start',l.g1); document.documentElement.style.setProperty('--lesson-end',l.g2); const view=$('#lessonView'); view.classList.remove('fade'); void view.offsetWidth; view.classList.add('fade'); view.innerHTML=`<article class="hero"><div><p class="eyebrow" style="color:#fff;opacity:.82">Dit hebben we deze week geleerd</p><h2>Les ${l.n} · ${l.title}</h2><p>${l.sub}.</p></div></article><article class="card tip"><h2>Samenvatting van de les</h2><p>${l.summary}</p></article><div class="content-grid"><article class="card"><h2>Dit neemt je kind mee uit de les</h2><p class="card-intro">Drie dingen die vandaag centraal stonden.</p><ul class="insights">${l.insights.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="card kitchen"><h2>Aan de keukentafel</h2><p class="card-intro">Benieuwd wat je kind heeft geleerd? Stel eens een van deze vragen.</p><div class="questions">${l.questions.map((x,i)=>`<div class="question"><span>${i+1}</span>${x}</div>`).join('')}</div></article></div><article class="card history"><div class="history-header"><h2>Eerder behandeld</h2><small>Meest recente les bovenaan</small></div><div class="lesson-list">${lessons.slice().reverse().map((x)=>`<button class="lesson-btn ${x.n===l.n?'active':''}" style="--lesson-start:${x.g1};--lesson-end:${x.g2}" data-lesson="${x.n-1}"><strong>Les ${x.n}</strong><span>${x.title}</span><time>${x.date}</time></button>`).join('')}</div></article>`; document.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.lesson);render(current)}));}
    const ACCESS_KEY='kvm_parent_access';
    function openPortal(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');render(current);window.scrollTo(0,0); }
    $('#loginForm').addEventListener('submit',e=>{e.preventDefault(); if($('#accessCode').value.trim().toUpperCase()==='8A-KVM'){ localStorage.setItem(ACCESS_KEY,'8A-KVM'); openPortal(); }else $('#loginError').classList.remove('hidden')});
    $('#logout').addEventListener('click',()=>{ localStorage.removeItem(ACCESS_KEY); $('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#logout').classList.add('hidden');$('#accessCode').value='';$('#loginError').classList.add('hidden');window.scrollTo(0,0)});
    if(localStorage.getItem(ACCESS_KEY)==='8A-KVM') openPortal();
  </script>
