<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Klaar voor Middelbaar</title>
  <meta name="description" content="Neem contact op met Klaar voor Middelbaar voor een demo, offerte of een andere vraag over onze programma's.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared-header-footer.css?v=22">
  <style>
    :root{--primary:#4e8ef3;--primary-dark:#1a4280;--coral:#e8886b;--ink:#182230;--muted:#687383;--surface:#fff;--bg:#eef4ff;--footer-bg:#f2f4f4;--border:#dbe3ef;--outer-w:1280px;--pad:32px;--r-card:28px;--r-pill:9999px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:'Inria Sans',Georgia,serif;color:var(--ink);background:#fff}
    body.contact-page{background:var(--footer-bg)}
    .contact-stage{position:relative;overflow:hidden;padding:150px var(--pad) 96px;color:#fff;background:linear-gradient(118deg,rgba(24,65,126,.96),rgba(78,142,243,.88)),url('../Afbeeldingen/Website/IMG_2094-scaled.jpg') center 46%/cover no-repeat}
    .contact-stage:before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.19) 1.5px,transparent 1.5px);background-size:28px 28px;pointer-events:none}
    .contact-stage:after{content:'';position:absolute;width:520px;height:520px;border-radius:50%;right:-160px;top:-210px;background:rgba(255,255,255,.09);pointer-events:none}
    .contact-layout{position:relative;z-index:1;width:min(var(--outer-w),100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,.82fr) minmax(560px,1.18fr);gap:72px;align-items:center}
    .contact-copy h1{max-width:570px;margin:0 0 24px;font-size:clamp(48px,5.4vw,76px);line-height:1.02;letter-spacing:-.035em}
    .contact-copy>p{max-width:530px;margin:0 0 42px;font-size:clamp(20px,2vw,26px);line-height:1.45}
    .contact-details{display:grid;gap:16px}
    .contact-detail{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;font-size:18px;font-weight:700;width:max-content;max-width:100%}
    .contact-detail__icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.1);font-size:18px}
    .contact-detail__icon svg{display:block;width:22px;height:22px;stroke:currentColor}
    .contact-detail:hover span:last-child{text-decoration:underline;text-underline-offset:5px}
    .contact-card{padding:42px 44px 44px;border-radius:34px;background:linear-gradient(120deg,rgba(255,255,255,.98) 14%,rgba(243,248,255,.98) 48%,rgba(207,226,255,.97) 100%);box-shadow:0 28px 70px rgba(13,39,79,.25);color:var(--ink);backdrop-filter:blur(8px)}
    .contact-card h2{margin:0 0 8px;color:var(--primary-dark);font-size:clamp(28px,3vw,39px);line-height:1.12}
    .contact-card>p{margin:0 0 28px;color:var(--muted);font-size:18px;line-height:1.45}
    .contact-form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
    .contact-form label{display:grid;gap:8px;color:var(--primary-dark);font-size:16px;font-weight:700}
    .contact-form input,.contact-form textarea{width:100%;border:1px solid #cbd8ec;border-radius:15px;background:#f6f9ff;color:var(--ink);font:inherit;font-weight:400;padding:15px 17px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
    .contact-form textarea{min-height:126px;resize:vertical}
    .contact-form input:focus,.contact-form textarea:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(78,142,243,.13)}
    .contact-form .full{grid-column:1/-1}
    .contact-form button{grid-column:1/-1;justify-self:start;margin-top:4px;border:0;border-radius:var(--r-pill);padding:17px 30px;background:var(--coral);color:#fff;font:700 18px 'Inria Sans',sans-serif;cursor:pointer;box-shadow:0 12px 25px rgba(138,62,39,.2);transition:transform .2s,box-shadow .2s}
    .contact-form button:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(138,62,39,.28)}
    @media(max-width:1000px){.contact-layout{grid-template-columns:1fr;gap:44px}.contact-copy{text-align:center}.contact-copy h1,.contact-copy>p{margin-left:auto;margin-right:auto}.contact-details{justify-content:center}.contact-card{width:min(680px,100%);margin:0 auto}}
    @media(max-width:700px){:root{--pad:20px}.contact-stage{padding:118px var(--pad) 56px}.contact-layout{gap:34px}.contact-copy h1{font-size:clamp(42px,12vw,58px)}.contact-copy>p{margin-bottom:30px;font-size:19px}.contact-details{justify-content:start;width:max-content;max-width:100%;margin:0 auto}.contact-detail{font-size:16px}.contact-card{padding:30px 22px;border-radius:26px}.contact-form{grid-template-columns:1fr;gap:16px}.contact-form .full,.contact-form button{grid-column:1}.contact-form button{width:100%}}
  </style>
</head>
<body class="contact-page">
  <main class="contact-stage">
    <div class="contact-layout">
      <section class="contact-copy">
        <h1>Neem contact met ons op</h1>
        <p>Wil je een demo of offerte aanvragen, of heb je gewoon een vraag? Laat het ons weten.</p>
        <div class="contact-details">
          <a class="contact-detail" href="mailto:contact@klaarvoormiddelbaar.nl"><span class="contact-detail__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke-width="2"/><path d="m4 7 8 6 8-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>contact@klaarvoormiddelbaar.nl</span></a>
          <a class="contact-detail" href="tel:+31633382366"><span class="contact-detail__icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg></span><span>+31 6 33382366</span></a>
        </div>
      </section>
      <section class="contact-card">
        <h2>Waar kunnen we je mee helpen?</h2>
        <p>Vul je gegevens in en vertel kort waar je interesse in hebt.</p>
        <form class="contact-form" action="/api/contact" method="post"><input type="text" name="website" autocomplete="off" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px">
          <label>Naam<input type="text" name="naam" placeholder="Je naam" required></label>
          <label>School<input type="text" name="school" placeholder="Naam van je school" required></label>
          <label>E-mailadres<input type="email" name="email" placeholder="naam@school.nl" required></label>
          <label>Telefoonnummer<input type="tel" name="telefoon" placeholder="06 12345678"></label>
          <label class="full">Waar kunnen we je mee helpen?<textarea name="bericht" placeholder="Bijvoorbeeld: proefaccount, offerte of vraag…" required></textarea></label>
          <button type="submit">Verstuur aanvraag</button>
        </form>
      </section>
    </div>
  </main>

  <script src="../shared-chrome.js?v=26"></script>
</body>
</html>
