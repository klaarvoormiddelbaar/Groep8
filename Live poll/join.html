<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doe mee aan de poll — Klaar voor Middelbaar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --card-bg: #ffffff;
      --primary: #72a8f9;
      --primary-dark: #4e8ef3;
      --primary-soft: rgba(78,142,243,0.10);
      --green: #10a37f;
      --green-dark: #0c8268;
      --dark: #191c1d;
      --muted: #6d747a;
      --border: #eceeee;
      --shadow-card: 0 20px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.10);
      --shadow-btn-green: 0 10px 15px -3px rgba(0,0,0,0.18), 0 4px 6px -4px rgba(0,0,0,0.10);
      --r-card: 40px;
      --r-pill: 9999px;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inria Sans', Georgia, serif;
      color: var(--dark);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
      background-color: #eef4fe;
      background-image:
        radial-gradient(ellipse at 12% -10%, rgba(114,168,249,0.30) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 110%, rgba(16,163,127,0.16) 0%, transparent 48%),
        radial-gradient(ellipse at 90% 0%,   rgba(251,191,36,0.14)  0%, transparent 40%);
      background-attachment: fixed;
    }

    .join-card {
      width: 100%; max-width: 460px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--r-card); box-shadow: var(--shadow-card);
      padding: 48px 44px;
      animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

    .join-logo { margin-bottom: 28px; text-align: center; }
    .join-logo img { height: 52px; width: auto; opacity: 0.92; }

    .poll-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--primary-soft); border: 1px solid rgba(78,142,243,0.25);
      border-radius: var(--r-pill); padding: 6px 14px;
      font-size: 12px; font-weight: 700; color: var(--primary);
      letter-spacing: 0.8px; text-transform: uppercase;
      margin-bottom: 14px;
    }

    .join-title { font-size: 28px; font-weight: 700; line-height: 1.28; margin-bottom: 10px; }
    .join-sub   { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 32px; }

    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 9px;
    }
    .field input {
      width: 100%; font-family: inherit; color: var(--dark);
      background: #f7f8f9; border: 1.5px solid var(--border); border-radius: 18px;
      padding: 16px 18px; font-size: 18px; font-weight: 700;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: rgba(109,116,122,0.55); font-weight: 400; }
    .field input:focus {
      outline: none; background: white; border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(78,142,243,0.16);
    }
    #code-input { letter-spacing: 9px; font-variant-numeric: tabular-nums; }

    .btn-meedoen {
      width: 100%; border: none; border-radius: var(--r-pill); cursor: pointer;
      font-family: inherit; font-size: 19px; font-weight: 700; color: white;
      background: var(--green); box-shadow: var(--shadow-btn-green);
      padding: 18px; margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s, background 0.2s;
    }
    .btn-meedoen:hover:not(:disabled) { background: var(--green-dark); transform: translateY(-3px); box-shadow: 0 18px 30px rgba(16,163,127,0.34); }
    .btn-meedoen:disabled { opacity: 0.6; cursor: progress; }
    .btn-arrow { transition: transform 0.2s; }
    .btn-meedoen:hover:not(:disabled) .btn-arrow { transform: translateX(4px); }

    .feedback {
      margin-top: 18px; border-radius: 16px; padding: 14px 18px;
      font-size: 14px; font-weight: 700; line-height: 1.5; display: none;
    }
    .feedback.fout  { display: block; background: #fef2f2; border: 1.5px solid #fecaca; color: #b91c1c; }
    .feedback.bezig { display: block; background: var(--primary-soft); border: 1.5px solid rgba(78,142,243,0.25); color: var(--primary-dark); }

    .join-footnote { margin-top: 28px; text-align: center; font-size: 13px; color: var(--muted); }

    .scale-preview {
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: #f7f8f9; border: 1px solid var(--border);
      border-radius: 20px; padding: 14px 18px; margin-bottom: 28px;
    }
    .scale-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .scale-circ {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 15px; font-weight: 700;
    }
    .scale-nr { font-size: 9px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.3; max-width: 56px; }
  
    .ei { height: 1.15em; width: auto; object-fit: contain; vertical-align: -0.2em; display: inline-block; }
  </style>
</head>
<body>
  <div class="join-card">
    <div class="join-logo">
      <img src="/Dashboard/KvM%20logo%20no%20background.png" alt="Klaar voor Middelbaar">
    </div>

    <div class="join-title">Vul de code van je juf of meester in en doe mee! <img class="ei" src="/Afbeeldingen/emoji/lamp.png" alt=""></div>
    <div class="join-sub">Geef aan hoe jij over elke stelling denkt:</div>

    <div class="scale-preview">
      <div class="scale-item"><div class="scale-circ" style="background:#ef4444">1</div><div class="scale-nr">Helemaal mee oneens</div></div>
      <div class="scale-item"><div class="scale-circ" style="background:#f97316">2</div><div class="scale-nr">Mee oneens</div></div>
      <div class="scale-item"><div class="scale-circ" style="background:#eab308">3</div><div class="scale-nr">Neutraal</div></div>
      <div class="scale-item"><div class="scale-circ" style="background:#22c55e">4</div><div class="scale-nr">Mee eens</div></div>
      <div class="scale-item"><div class="scale-circ" style="background:#10a37f">5</div><div class="scale-nr">Helemaal mee eens</div></div>
    </div>

    <form id="join-form" autocomplete="off">
      <div class="field">
        <label for="code-input">Code</label>
        <input id="code-input" name="code" type="text" inputmode="numeric" maxlength="6"
               placeholder="123456" autocomplete="off">
      </div>
      <div class="field">
        <label for="naam-input">Jouw voornaam</label>
        <input id="naam-input" name="naam" type="text" maxlength="24"
               placeholder="Bijvoorbeeld: Sem" autocomplete="off">
      </div>
      <button class="btn-meedoen" id="btn-meedoen" type="submit">
        Meedoen <span class="btn-arrow">→</span>
      </button>
      <div class="feedback" id="feedback"></div>
    </form>

    <div class="join-footnote">Vraag je juf of meester om de 6-cijferige code als je die nog niet hebt.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Live%20poll/supabase-config.js"></script>
  <script>
    // Als de docent ingelogd is, stuur meteen door naar de docentenweergave
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        const match  = window.location.pathname.match(/\/les(\d+)\//i);
        const lesNum = match ? match[1] : '1';
        window.location.replace(`/les${lesNum}/docent/poll`);
      }
    })();

    const form      = document.getElementById('join-form');
    const codeInput = document.getElementById('code-input');
    const naamInput = document.getElementById('naam-input');
    const knop      = document.getElementById('btn-meedoen');
    const feedback  = document.getElementById('feedback');

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
      verbergFeedback();
    });
    naamInput.addEventListener('input', verbergFeedback);

    function toonFeedback(soort, bericht) {
      feedback.className = `feedback ${soort}`;
      feedback.textContent = bericht;
    }
    function verbergFeedback() {
      feedback.className = 'feedback';
      feedback.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = codeInput.value.trim();
      const naam = naamInput.value.trim();

      if (code.length !== 6) {
        toonFeedback('fout', 'Een sessiecode bestaat uit 6 cijfers. Controleer de code op het bord.');
        return;
      }
      if (!naam) {
        toonFeedback('fout', 'Vul je voornaam in zodat de klas ziet dat je meedoet.');
        return;
      }

      knop.disabled = true;
      toonFeedback('bezig', 'Even kijken of deze poll actief is…');

      try {
        const { data: sessie, error: zoekFout } = await db
          .from('sessions')
          .select('id, status')
          .eq('code', code)
          .neq('status', 'ended')
          .maybeSingle();

        if (zoekFout) throw new Error(zoekFout.message);
        if (!sessie) {
          toonFeedback('fout', 'Deze code klopt niet (meer), of de poll is al afgelopen. Vraag je juf of meester om de juiste code.');
          knop.disabled = false;
          return;
        }

        toonFeedback('bezig', 'Je wordt aangemeld…');

        const { data: deelnemer, error: meldFout } = await db
          .from('participants')
          .insert({ session_id: sessie.id, naam })
          .select()
          .single();

        if (meldFout) throw new Error(meldFout.message);

        const url = new URL('/Live%20poll/leerling-poll.html', window.location.origin);
        url.searchParams.set('code', code);
        url.searchParams.set('deelnemer', deelnemer.id);
        window.location.href = url.href;
      } catch (fout) {
        toonFeedback('fout', 'Er ging iets mis: ' + fout.message);
        knop.disabled = false;
      }
    });
  </script>
</body>
</html>
