<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live poll — Klaar voor Middelbaar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page-bg:      #f2f6fd;
      --card-bg:      #ffffff;
      --footer-bg:    #f2f4f4;
      --primary:      #72a8f9;
      --primary-dark: #4e8ef3;
      --primary-soft: rgba(78,142,243,0.10);
      --green:        #10a37f;
      --green-dark:   #0c8268;
      --dark:         #191c1d;
      --muted:        #6d747a;
      --border:       #eceeee;
      --shadow-card:  0 20px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.10);
      --shadow-blue:  0 10px 20px rgba(78,142,243,0.30);
      --shadow-green: 0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -4px rgba(0,0,0,0.10);
      --max-w:        1184px;
      --pad:          48px;
      --r-card:       40px;
      --r-pill:       9999px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inria Sans', Georgia, serif;
      color: var(--dark);
      min-height: 100vh;
      background-color: #f2f6fd;
      background-image:
        radial-gradient(rgba(78,142,243,0.055) 1.5px, transparent 1.5px),
        radial-gradient(ellipse at 108% -8%,  rgba(114,168,249,0.22) 0%, transparent 52%),
        radial-gradient(ellipse at -8%   8%,  rgba(156,196,238,0.18) 0%, transparent 48%),
        radial-gradient(ellipse at 108% 60%,  rgba(16,163,127,0.07)  0%, transparent 42%),
        radial-gradient(ellipse at -5%  100%, rgba(251,191,36,0.08)  0%, transparent 44%),
        radial-gradient(ellipse at 50%  40%,  rgba(255,255,255,0.65) 0%, transparent 58%);
      background-size: 28px 28px, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
      background-attachment: scroll, fixed, fixed, fixed, fixed, fixed;
    }

    /* ── HEADER ───────────────────────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(242,246,253,0.90);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .header-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 0 var(--pad); height: 72px;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; flex-shrink: 0; }
    .logo-mark {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 13px; font-weight: 700; letter-spacing: -0.3px;
      box-shadow: var(--shadow-blue);
    }
    .logo-name { font-size: 15px; font-weight: 700; color: var(--dark); line-height: 1.15; }
    .logo-role { font-size: 11px; font-weight: 400; color: var(--muted); }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .bc-link  { color: var(--muted); text-decoration: none; font-weight: 400; transition: color 0.2s; }
    .bc-link:hover { color: var(--primary); }
    .bc-sep     { color: rgba(109,116,122,0.4); }
    .bc-current { color: var(--primary); font-weight: 700; }
    .nav-right  { display: flex; align-items: center; gap: 14px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.25);
      color: #c0392b; font-size: 13px; font-weight: 700;
      border-radius: var(--r-pill); padding: 7px 16px;
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: pulse 1.6s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}  50%{opacity:0.4;transform:scale(0.78);} }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      border: 2.5px solid var(--primary);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }
    .avatar:hover { transform: scale(1.06); box-shadow: 0 0 0 4px rgba(78,142,243,0.20); }

    /* ── PROGRESS STEPPER BAR ─────────────────────────────────────── */
    .stepper-outer {
      border-top: 1px solid rgba(236,238,238,0.6);
      background: rgba(255,255,255,0.52);
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      display: none;
    }
    .stepper-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 14px var(--pad);
      display: flex; align-items: center;
    }
    .step-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
    .step-circle {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--border); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      opacity: 0.4;
      transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
    }
    .step-item.actief .step-circle {
      width: 40px; height: 40px;
      background: var(--primary); color: white; opacity: 1;
      box-shadow: 0 0 0 4px rgba(78,142,243,0.20), 0 10px 15px -3px rgba(0,0,0,0.10);
    }
    .step-item.klaar .step-circle { background: var(--green); color: white; opacity: 1; }
    .step-label {
      font-size: 11px; color: var(--muted); font-weight: 400; opacity: 0.4;
      white-space: nowrap; transition: all 0.3s;
    }
    .step-item.actief .step-label { opacity: 1; font-weight: 700; color: var(--primary); }
    .step-item.klaar  .step-label { opacity: 0.75; }
    .step-connector {
      height: 2px; flex: 1; min-width: 20px; max-width: 72px;
      background: var(--border); margin-bottom: 22px;
      transition: background 0.4s;
    }
    .step-connector.klaar { background: var(--green); }

    /* ── MAIN ─────────────────────────────────────────────────────── */
    .main { max-width: var(--max-w); margin: 0 auto; padding: 48px var(--pad) 96px; position: relative; z-index: 1; }
    .view { animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px);}  to{opacity:1;transform:translateY(0);} }

    /* ── BUTTONS ──────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      border: none; border-radius: var(--r-pill); cursor: pointer;
      font-family: inherit; font-size: 17px; font-weight: 700;
      padding: 17px 36px; text-decoration: none; white-space: nowrap;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s, background 0.2s;
    }
    .btn-blue  { background: var(--primary); color: white; box-shadow: var(--shadow-blue); }
    .btn-blue:hover  { background: var(--primary-dark); transform: translateY(-3px); box-shadow: 0 16px 28px rgba(78,142,243,0.38); }
    .btn-green { background: var(--green); color: white; box-shadow: var(--shadow-green); }
    .btn-green:hover { background: var(--green-dark); transform: translateY(-3px); }
    .btn-ghost { background: #f0f2f5; color: var(--muted); padding: 17px 28px; }
    .btn-ghost:hover { background: #e7eaef; color: var(--dark); }

    /* ── LOADING / ERROR ──────────────────────────────────────────── */
    .loading-card, .error-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); padding: 64px 48px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid var(--primary-soft); border-top-color: var(--primary);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg);} }
    .loading-card p, .error-body { color: var(--muted); font-size: 16px; }
    .error-icon  { font-size: 40px; }
    .error-title { font-size: 24px; font-weight: 700; }

    /* ── LOBBY ────────────────────────────────────────────────────── */
    .lobby-hero {
      background: linear-gradient(135deg, #1a4280 0%, #3a7bd5 48%, #6aaaf8 78%, #9ac4fb 100%);
      border-radius: var(--r-card); padding: 52px 56px; color: white;
      position: relative; overflow: hidden; margin-bottom: 28px;
    }
    .lobby-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.12) 1.5px, transparent 1.5px);
      background-size: 26px 26px; border-radius: inherit; pointer-events: none;
    }
    .lobby-hero::after {
      content: ''; position: absolute; top: -140px; right: -100px;
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .lobby-eyebrow {
      position: relative; font-size: 13px; font-weight: 700; letter-spacing: 1.4px;
      text-transform: uppercase; color: rgba(255,255,255,0.78); margin-bottom: 10px;
    }
    .lobby-title { position: relative; font-size: 36px; font-weight: 700; margin-bottom: 12px; }
    .lobby-sub {
      position: relative; font-size: 16px; color: rgba(255,255,255,0.86);
      margin-bottom: 28px; max-width: 520px; line-height: 1.55;
    }
    .lobby-sub strong { color: white; }
    .code-display { position: relative; display: flex; gap: 12px; flex-wrap: wrap; }
    .code-digit {
      width: 64px; height: 80px; border-radius: 18px;
      background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.38);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 700;
    }

    .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }

    .panel {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); padding: 36px 40px;
    }
    .panel-head   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .panel-title  { font-size: 20px; font-weight: 700; }
    .panel-badge  {
      font-size: 14px; font-weight: 700; color: var(--primary);
      background: var(--primary-soft); border-radius: var(--r-pill); padding: 7px 16px;
    }

    .deelnemers-grid { display: flex; flex-wrap: wrap; gap: 12px; min-height: 56px; }
    .d-chip {
      display: flex; align-items: center; gap: 10px;
      background: #f7f8f9; border: 1px solid var(--border); border-radius: var(--r-pill);
      padding: 8px 18px 8px 8px;
      animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    .d-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: white; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .d-naam { font-size: 15px; font-weight: 700; }
    .leeg { color: var(--muted); font-size: 15px; padding: 12px 4px; }

    .stelling-lijst { display: flex; flex-direction: column; gap: 10px; }
    .stelling-rij {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 16px; background: #f7f8f9; border: 1px solid var(--border);
      border-radius: 18px;
    }
    .st-nr {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary-soft); color: var(--primary);
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .st-txt { font-size: 15px; line-height: 1.5; padding-top: 3px; }

    .acties { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }

    /* ── STELLING ACTIEF (while voting) ───────────────────────────── */
    .poll-kop {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 14px; margin-bottom: 22px;
    }
    .poll-stap { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--primary); }
    .poll-meta { display: flex; gap: 10px; flex-wrap: wrap; }
    .meta-chip {
      font-size: 14px; font-weight: 700; color: var(--dark);
      background: white; border: 1px solid var(--border); border-radius: var(--r-pill);
      padding: 9px 18px; box-shadow: 0 1px 1px rgba(0,0,0,0.04);
    }

    .stelling-kaart {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); padding: 52px 56px; margin-bottom: 28px;
      position: relative; overflow: hidden;
    }
    .stelling-kaart::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(90deg, #1e4a8a, var(--primary), var(--green));
    }
    .stelling-badge {
      display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--primary); background: var(--primary-soft);
      border-radius: var(--r-pill); padding: 6px 14px; margin-bottom: 20px;
    }
    .stelling-tekst {
      font-size: 32px; font-weight: 700; line-height: 1.32; color: var(--dark); margin-bottom: 40px;
    }
    .schaal-hint { display: flex; gap: 10px; flex-wrap: wrap; }
    .schaal-hint-item {
      display: flex; align-items: center; gap: 8px;
      background: #f7f8f9; border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px;
    }
    .sh-emoji { font-size: 20px; }
    .sh-txt { font-size: 13px; font-weight: 700; color: var(--muted); }

    /* Vote counter ring */
    .teller-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .ring-outer {
      width: 140px; height: 140px; border-radius: 50%;
      background: conic-gradient(var(--primary) 0%, #e1e3e3 0%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(78,142,243,0.18);
      transition: background 0.5s ease;
    }
    .ring-inner {
      width: 104px; height: 104px; border-radius: 50%;
      background: white; border: 2px solid rgba(236,238,238,0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    }
    .ring-n    { font-size: 34px; font-weight: 700; line-height: 1; color: var(--dark); }
    .ring-van  { font-size: 13px; font-weight: 700; color: var(--muted); }
    .ring-label { font-size: 14px; font-weight: 700; color: var(--muted); text-align: center; max-width: 140px; }

    /* ── RESULTATEN ───────────────────────────────────────────────── */
    .resultaten-kaart {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); padding: 52px 56px; margin-bottom: 28px;
      position: relative; overflow: hidden;
    }
    .resultaten-kaart::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(90deg, var(--green), #4ade80, var(--primary));
    }
    .res-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 24px; margin-bottom: 40px;
    }
    .res-info { flex: 1; min-width: 0; }
    .res-badge {
      display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--green); background: rgba(16,163,127,0.10);
      border-radius: var(--r-pill); padding: 6px 14px; margin-bottom: 16px;
    }
    .res-stelling-tekst {
      font-size: 22px; font-weight: 700; color: var(--dark); line-height: 1.38; max-width: 560px;
    }
    .gem-blok {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: linear-gradient(135deg, rgba(78,142,243,0.07), rgba(16,163,127,0.07));
      border: 1px solid rgba(78,142,243,0.18); border-radius: 24px;
      padding: 22px 36px; flex-shrink: 0;
    }
    .gem-lbl { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .gem-nr  { font-size: 52px; font-weight: 700; line-height: 1; color: var(--primary); }
    .gem-sub { font-size: 13px; color: var(--muted); }

    /* Horizontal bar chart */
    .chart  { display: flex; flex-direction: column; gap: 18px; }
    .chart-rij { display: flex; align-items: center; gap: 16px; }
    .chart-links {
      display: flex; align-items: center; gap: 10px; width: 240px; flex-shrink: 0;
    }
    .chart-circ {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: white;
    }
    .chart-emoji { font-size: 22px; flex-shrink: 0; line-height: 1; }
    .chart-lbl   { font-size: 14px; font-weight: 700; color: var(--dark); line-height: 1.3; }
    .balk-track  { flex: 1; height: 40px; background: #f0f2f5; border-radius: var(--r-pill); overflow: hidden; min-width: 0; }
    .balk {
      height: 100%; border-radius: var(--r-pill); width: 0%;
      transition: width 0.85s cubic-bezier(0.22,1,0.36,1);
      display: flex; align-items: center; padding: 0 14px; justify-content: flex-end;
    }
    .balk-pct {
      font-size: 13px; font-weight: 700; color: white;
      opacity: 0; transition: opacity 0.4s 0.65s; white-space: nowrap;
    }
    .balk.gevuld .balk-pct { opacity: 1; }
    .chart-rechts { width: 64px; flex-shrink: 0; text-align: right; }
    .chart-cnt { font-size: 15px; font-weight: 700; color: var(--dark); }
    .chart-pct { font-size: 12px; color: var(--muted); }

    /* ── EINDSCHERM ───────────────────────────────────────────────── */
    .eind-hero {
      background: linear-gradient(135deg, #134e4a 0%, #0f766e 55%, #14b8a6 100%);
      border-radius: var(--r-card); padding: 52px 56px; color: white;
      position: relative; overflow: hidden; margin-bottom: 28px;
    }
    .eind-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.10) 1.5px, transparent 1.5px);
      background-size: 26px 26px; border-radius: inherit; pointer-events: none;
    }
    .eind-eyebrow { position: relative; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,0.78); margin-bottom: 10px; }
    .eind-title   { position: relative; font-size: 38px; font-weight: 700; margin-bottom: 10px; }
    .eind-sub     { position: relative; font-size: 16px; color: rgba(255,255,255,0.88); }

    .samenvatting-kaart {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 28px;
    }
    .sam-hoofd {
      display: grid; grid-template-columns: 3fr 2fr 80px;
      padding: 14px 36px; gap: 24px; align-items: center;
      background: #f7f8f9;
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
    }
    .sam-rij {
      display: grid; grid-template-columns: 3fr 2fr 80px;
      padding: 24px 36px; gap: 24px; align-items: center;
      border-top: 1px solid var(--border);
    }
    .sam-stelling-nr { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 6px; }
    .sam-stelling-txt { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 5px; }
    .sam-n          { font-size: 13px; color: var(--muted); }
    .sam-balk-track { height: 12px; background: #f0f2f5; border-radius: var(--r-pill); overflow: hidden; margin-bottom: 10px; }
    .sam-balk       { height: 100%; border-radius: var(--r-pill); width: 0%; transition: width 1s cubic-bezier(0.22,1,0.36,1); }
    .sam-emojis     { display: flex; gap: 5px; }
    .sam-gem        { font-size: 28px; font-weight: 700; text-align: right; }

    /* ── FOOTER ───────────────────────────────────────────────────── */
    .footer {
      background: var(--footer-bg);
      border-radius: 64px 64px 0 0;
      padding: 40px var(--pad); position: relative; z-index: 1;
    }
    .footer-inner {
      max-width: var(--max-w); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-links { display: flex; gap: 32px; }
    .footer-links a { font-size: 16px; font-weight: 700; color: var(--dark); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--primary); }
    .footer-copy { font-size: 16px; color: var(--muted); }

    @media (max-width: 860px) {
      :root { --pad: 24px; }
      .cols-2 { grid-template-columns: 1fr; }
      .stelling-tekst { font-size: 24px; }
      .chart-links { width: 180px; }
      .chart-lbl { font-size: 12px; }
      .gem-nr { font-size: 40px; }
    }
  </style>
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="../Dashboard/dashboard.html">
        <div class="logo-mark">KvM</div>
        <div>
          <div class="logo-name">Klaar voor Middelbaar</div>
          <div class="logo-role">Live poll · Docentweergave</div>
        </div>
      </a>
      <nav class="breadcrumb">
        <a class="bc-link" href="../Dashboard/dashboard.html">Docentenportaal</a>
        <span class="bc-sep">/</span>
        <span class="bc-current" id="bc-les">Live poll</span>
      </nav>
      <div class="nav-right">
        <div class="live-pill"><span class="live-dot"></span> Live</div>
        <div class="avatar" id="docent-avatar" title="">··</div>
      </div>
    </div>
    <!-- Progress stepper (hidden until poll starts) -->
    <div class="stepper-outer" id="stepper-outer">
      <div class="stepper-inner" id="stepper-inner"></div>
    </div>
  </header>

  <!-- ── MAIN ────────────────────────────────────────────────────── -->
  <main class="main" id="app">
    <div class="view">
      <div class="loading-card">
        <div class="spinner"></div>
        <p>Sessie wordt aangemaakt…</p>
      </div>
    </div>
  </main>

  <!-- ── FOOTER ──────────────────────────────────────────────────── -->
  <footer class="footer">
    <div class="footer-inner">
      <a class="logo" href="../Dashboard/dashboard.html">
        <div class="logo-mark">KvM</div>
        <div><div class="logo-name">Klaar voor Middelbaar</div></div>
      </a>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Contact</a>
        <a href="#">Hulp</a>
      </div>
      <div class="footer-copy">© 2026 Klaar voor Middelbaar</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Live%20poll/supabase-config.js"></script>
  <script>
    // ── Poll-stellingen (aanpasbaar per les) ─────────────────────────────────
    const STELLINGEN_TEKST = [
      'Ik vind het makkelijk om hulp te vragen.',
      'Ik kijk uit naar de middelbare school.',
      'Ik kan goed zelfstandig werken.',
      'Ik durf fouten te maken.',
      'Ik ben goed in plannen.'
    ];

    const SCHAAL = [
      { score: 1, label: 'Helemaal mee oneens', emoji: '😞', kleur: '#ef4444' },
      { score: 2, label: 'Mee oneens',          emoji: '😕', kleur: '#f97316' },
      { score: 3, label: 'Neutraal',             emoji: '😐', kleur: '#eab308' },
      { score: 4, label: 'Mee eens',             emoji: '🙂', kleur: '#22c55e' },
      { score: 5, label: 'Helemaal mee eens',    emoji: '😊', kleur: '#10a37f' },
    ];

    // ── State ────────────────────────────────────────────────────────────────
    const params     = new URLSearchParams(window.location.search);
    const lesId      = params.get('les')   || 'poll-les-1';
    const LES_TITELS = {
      'poll-les-1': 'Welkom bij KvM', 'poll-les-2': 'De nieuwe school', 'poll-les-3': 'Slim plannen',
      'poll-les-4': 'Nieuwe vrienden', 'poll-les-5': 'Formeel & Informeel', 'poll-les-6': 'Gevoel & Zelfvertrouwen',
      'poll-les-7': 'Sociale situaties', 'poll-les-8': 'Klaar voor de start!'
    };
    const lesTitel   = LES_TITELS[lesId] || 'Onbekende les';
    const docentNaam = params.get('naam')  || 'Docent';

    const app = document.getElementById('app');
    document.getElementById('docent-avatar').textContent = docentNaam.slice(0, 2).toUpperCase();
    document.getElementById('docent-avatar').title = docentNaam;
    document.getElementById('bc-les').textContent = lesTitel;

    let sessie          = null;
    let stellingen      = [];
    const deelnemers    = new Map();
    let antwoordKanaal  = null;
    let stemTellingen   = [0, 0, 0, 0, 0];
    let aantalStemmen   = 0;
    let huidigeIndex    = -1;
    let huidigView      = 'loading';

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function toonFout(msg) {
      app.innerHTML = `
        <div class="view">
          <div class="error-card">
            <div class="error-icon">⚠️</div>
            <div class="error-title">Er ging iets mis</div>
            <div class="error-body">${esc(msg)}</div>
          </div>
        </div>`;
    }

    function gemiddeldeKleur(gem) {
      if (!gem || gem === 0) return 'var(--muted)';
      if (gem < 2)   return '#ef4444';
      if (gem < 2.5) return '#f97316';
      if (gem < 3.5) return '#eab308';
      if (gem < 4.5) return '#22c55e';
      return '#10a37f';
    }

    // ── Sessie aanmaken ──────────────────────────────────────────────────────
    async function init() {
      let code;
      try { code = await genereerUniekeSessieCode(); }
      catch (e) { toonFout(e.message); return; }

      const { data: nieuweSessie, error: se } = await db
        .from('sessions')
        .insert({ code, les_id: lesId, docent_naam: docentNaam, status: 'lobby', huidige_vraag_index: 0 })
        .select().single();
      if (se) { toonFout('Kon sessie niet aanmaken: ' + se.message); return; }
      sessie = nieuweSessie;

      const rijen = STELLINGEN_TEKST.map((tekst, i) => ({
        session_id: sessie.id, tekst, volgorde: i, status: 'waiting'
      }));
      const { data: opgeslagen, error: sfe } = await db
        .from('poll_statements').insert(rijen).select();
      if (sfe) { toonFout('Kon stellingen niet opslaan: ' + sfe.message); return; }
      stellingen = opgeslagen.slice().sort((a, b) => a.volgorde - b.volgorde);

      abonneerOpDeelnemers();
      abonneerOpSessie();
      bouwStepper();
      toonWachtkamer();
    }

    // ── Realtime-abonnementen ────────────────────────────────────────────────
    function abonneerOpDeelnemers() {
      db.channel(`docent-dl-${sessie.id}`)
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'participants',
          filter: `session_id=eq.${sessie.id}`
        }, p => {
          deelnemers.set(p.new.id, p.new.naam);
          ververDeelnemers();
          ververTeller();
        })
        .subscribe();
    }

    function abonneerOpSessie() {
      db.channel(`docent-sessie-${sessie.id}`)
        .on('postgres_changes', {
          event: 'UPDATE', schema: 'public', table: 'sessions', filter: `id=eq.${sessie.id}`
        }, p => {
          sessie = { ...sessie, ...p.new };
          if (sessie.status === 'ended' && huidigView !== 'einde') toonEinde();
        })
        .subscribe();
    }

    function abonneerOpStemmen(stellingId) {
      if (antwoordKanaal) { db.removeChannel(antwoordKanaal); antwoordKanaal = null; }
      stemTellingen = [0, 0, 0, 0, 0];
      aantalStemmen = 0;
      antwoordKanaal = db.channel(`docent-stemmen-${stellingId}`)
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'poll_responses',
          filter: `statement_id=eq.${stellingId}`
        }, p => {
          const idx = p.new.score - 1;
          stemTellingen[idx] = (stemTellingen[idx] || 0) + 1;
          aantalStemmen++;
          ververStemTeller();
        })
        .subscribe();
    }

    // ── Progress stepper ─────────────────────────────────────────────────────
    function bouwStepper() {
      const inner = document.getElementById('stepper-inner');
      if (!inner) return;
      inner.innerHTML = stellingen.map((_, i) => `
        <div class="step-item" id="step-${i}">
          <div class="step-circle">${i + 1}</div>
          <div class="step-label">Stelling ${i + 1}</div>
        </div>
        ${i < stellingen.length - 1 ? `<div class="step-connector" id="conn-${i}"></div>` : ''}
      `).join('');
    }

    function updateStepper(actief) {
      document.getElementById('stepper-outer').style.display = '';
      stellingen.forEach((_, i) => {
        const el  = document.getElementById(`step-${i}`);
        const con = document.getElementById(`conn-${i}`);
        if (!el) return;
        el.className = 'step-item' + (i === actief ? ' actief' : i < actief ? ' klaar' : '');
        el.querySelector('.step-circle').innerHTML = i < actief ? '✓' : String(i + 1);
        if (con) con.className = 'step-connector' + (i < actief ? ' klaar' : '');
      });
    }

    // ── Wachtkamer ────────────────────────────────────────────────────────────
    function toonWachtkamer() {
      huidigView = 'lobby';
      const lesNum = lesId.replace('poll-les-', '');
      const joinUrl = `${window.location.origin}/les${lesNum}/poll`;
      app.innerHTML = `
        <div class="view">
          <div class="lobby-hero">
            <div class="lobby-eyebrow">Live poll · ${esc(lesTitel)}</div>
            <div class="lobby-title">Klaar om te starten? 🗳️</div>
            <div class="lobby-sub">
              Laat leerlingen <strong>${esc(joinUrl.replace(/^https?:\/\//, ''))}</strong> openen
              en deze code invoeren samen met hun voornaam:
            </div>
            <div class="code-display">
              ${sessie.code.split('').map(c => `<div class="code-digit">${c}</div>`).join('')}
            </div>
          </div>

          <div class="cols-2">
            <div class="panel">
              <div class="panel-head">
                <div class="panel-title">Deelnemers</div>
                <div class="panel-badge" id="teller-badge">0 leerlingen</div>
              </div>
              <div class="deelnemers-grid" id="d-grid">
                <div class="leeg">Nog niemand binnen — leerlingen verschijnen hier zodra ze meedoen.</div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-head">
                <div class="panel-title">Stellingen in deze poll</div>
                <div class="panel-badge">${stellingen.length} stellingen</div>
              </div>
              <div class="stelling-lijst">
                ${stellingen.map((st, i) => `
                  <div class="stelling-rij">
                    <div class="st-nr">${i + 1}</div>
                    <div class="st-txt">${esc(st.tekst)}</div>
                  </div>`).join('')}
              </div>
            </div>
          </div>

          <div class="acties">
            <button class="btn btn-ghost" onclick="bevestigBeeindigen()">Sessie afbreken</button>
            <button class="btn btn-blue"  onclick="startPoll()">Start poll 🗳️</button>
          </div>
        </div>`;
      ververDeelnemers();
      ververTeller();
    }

    function ververDeelnemers() {
      const g = document.getElementById('d-grid');
      if (!g) return;
      if (deelnemers.size === 0) {
        g.innerHTML = `<div class="leeg">Nog niemand binnen — leerlingen verschijnen hier zodra ze meedoen.</div>`;
        return;
      }
      g.innerHTML = [...deelnemers.values()].map(naam => `
        <div class="d-chip">
          <div class="d-avatar">${esc(naam.slice(0, 1).toUpperCase())}</div>
          <div class="d-naam">${esc(naam)}</div>
        </div>`).join('');
    }

    function ververTeller() {
      const t = document.getElementById('teller-badge');
      if (t) t.textContent = `${deelnemers.size} ${deelnemers.size === 1 ? 'leerling' : 'leerlingen'}`;
    }

    async function startPoll() {
      const { error: se } = await db.from('sessions')
        .update({ status: 'active', huidige_vraag_index: 0 }).eq('id', sessie.id);
      if (se) { alert('Kon sessie niet starten: ' + se.message); return; }
      const { error: sfe } = await db.from('poll_statements')
        .update({ status: 'active' }).eq('id', stellingen[0].id);
      if (sfe) { alert('Kon eerste stelling niet activeren: ' + sfe.message); return; }
      stellingen[0].status = 'active';
      huidigeIndex = 0;
      sessie.status = 'active';
      toonStellingActief();
    }

    // ── Stelling actief (terwijl leerlingen stemmen) ─────────────────────────
    function toonStellingActief() {
      huidigView = 'stelling';
      updateStepper(huidigeIndex);
      abonneerOpStemmen(stellingen[huidigeIndex].id);
      const st = stellingen[huidigeIndex];

      app.innerHTML = `
        <div class="view">
          <div class="poll-kop">
            <div class="poll-stap">Stelling ${huidigeIndex + 1} van ${stellingen.length} · Stemmen loopt</div>
            <div class="poll-meta">
              <div class="meta-chip">👥 ${deelnemers.size} deelnemers</div>
              <div class="meta-chip" id="stem-chip">📩 0 van ${deelnemers.size} gestemd</div>
            </div>
          </div>

          <div class="cols-2" style="margin-bottom:28px">
            <div class="stelling-kaart" style="margin-bottom:0">
              <div class="stelling-badge">Stelling ${huidigeIndex + 1}</div>
              <div class="stelling-tekst">${esc(st.tekst)}</div>
              <div class="schaal-hint">
                ${SCHAAL.map(s => `
                  <div class="schaal-hint-item">
                    <span class="sh-emoji">${s.emoji}</span>
                    <span class="sh-txt">${s.score} = ${s.label}</span>
                  </div>`).join('')}
              </div>
            </div>

            <div class="panel" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
              <div class="teller-wrap">
                <div class="ring-outer" id="ring">
                  <div class="ring-inner">
                    <div class="ring-n" id="ring-n">0</div>
                    <div class="ring-van">van ${deelnemers.size}</div>
                  </div>
                </div>
                <div class="ring-label">leerlingen hebben gestemd</div>
              </div>
            </div>
          </div>

          <div class="acties">
            <button class="btn btn-ghost" onclick="bevestigBeeindigen()">Sessie beëindigen</button>
            <button class="btn btn-green" onclick="laadResultaten()">Toon resultaten →</button>
          </div>
        </div>`;
    }

    function ververStemTeller() {
      const n    = document.getElementById('ring-n');
      const chip = document.getElementById('stem-chip');
      const ring = document.getElementById('ring');
      if (n) n.textContent = aantalStemmen;
      if (chip) chip.textContent = `📩 ${aantalStemmen} van ${deelnemers.size} gestemd`;
      if (ring) {
        const pct = deelnemers.size > 0 ? Math.round((aantalStemmen / deelnemers.size) * 100) : 0;
        ring.style.background = `conic-gradient(var(--primary) ${pct}%, #e1e3e3 ${pct}%)`;
      }
    }

    // ── Resultaten tonen ─────────────────────────────────────────────────────
    async function laadResultaten() {
      if (antwoordKanaal) { db.removeChannel(antwoordKanaal); antwoordKanaal = null; }
      const st = stellingen[huidigeIndex];

      const { error: ce } = await db.from('poll_statements').update({ status: 'closed' }).eq('id', st.id);
      if (ce) { alert('Kon stelling niet sluiten: ' + ce.message); return; }
      stellingen[huidigeIndex].status = 'closed';

      const { data: stemmen } = await db.from('poll_responses').select('score').eq('statement_id', st.id);
      const tellingen = [0, 0, 0, 0, 0];
      (stemmen || []).forEach(r => { if (r.score >= 1 && r.score <= 5) tellingen[r.score - 1]++; });
      const totaal = tellingen.reduce((a, b) => a + b, 0);
      const gemiddelde = totaal === 0 ? 0 : tellingen.reduce((a, c, i) => a + c * (i + 1), 0) / totaal;

      toonResultaten(st, tellingen, totaal, gemiddelde);
    }

    function toonResultaten(st, tellingen, totaal, gemiddelde) {
      huidigView = 'resultaten';
      const isLaatste = huidigeIndex === stellingen.length - 1;

      app.innerHTML = `
        <div class="view">
          <div class="poll-kop">
            <div class="poll-stap">Stelling ${huidigeIndex + 1} van ${stellingen.length} · Resultaten</div>
            <div class="poll-meta">
              <div class="meta-chip">👥 ${deelnemers.size} deelnemers</div>
              <div class="meta-chip">✅ ${totaal} stemmen ontvangen</div>
            </div>
          </div>

          <div class="resultaten-kaart">
            <div class="res-top">
              <div class="res-info">
                <div class="res-badge">✓ Stemmen gesloten · Stelling ${huidigeIndex + 1}</div>
                <div class="res-stelling-tekst">${esc(st.tekst)}</div>
              </div>
              <div class="gem-blok">
                <div class="gem-lbl">Gemiddelde</div>
                <div class="gem-nr" style="color:${gemiddeldeKleur(gemiddelde)}">${totaal === 0 ? '–' : gemiddelde.toFixed(1)}</div>
                <div class="gem-sub">van 5</div>
              </div>
            </div>

            <div class="chart">
              ${SCHAAL.map((s, i) => {
                const cnt = tellingen[i];
                const pct = totaal === 0 ? 0 : Math.round((cnt / totaal) * 100);
                const isGem = totaal > 0 && Math.round(gemiddelde) === s.score;
                return `
                  <div class="chart-rij">
                    <div class="chart-links">
                      <div class="chart-circ" style="background:${s.kleur}">${s.score}</div>
                      <div class="chart-emoji">${s.emoji}</div>
                      <div class="chart-lbl" style="${isGem ? 'color:'+s.kleur : ''}">${s.label}${isGem ? ' ←' : ''}</div>
                    </div>
                    <div class="balk-track">
                      <div class="balk" id="balk-${i}" style="background:${s.kleur}">
                        <span class="balk-pct">${pct > 10 ? pct + '%' : ''}</span>
                      </div>
                    </div>
                    <div class="chart-rechts">
                      <div class="chart-cnt">${cnt}</div>
                      <div class="chart-pct">${pct}%</div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>

          <div class="acties">
            <button class="btn btn-ghost" onclick="bevestigBeeindigen()">Sessie beëindigen</button>
            ${isLaatste
              ? `<button class="btn btn-green" onclick="beeindigPoll()">Klaar! Sluit poll →</button>`
              : `<button class="btn btn-blue"  onclick="volgendeStelling()">Volgende stelling →</button>`}
          </div>
        </div>`;

      requestAnimationFrame(() => setTimeout(() => {
        tellingen.forEach((cnt, i) => {
          const balk = document.getElementById(`balk-${i}`);
          if (!balk) return;
          const pct = totaal === 0 ? 0 : Math.round((cnt / totaal) * 100);
          balk.style.width = `${pct}%`;
          if (pct > 10) balk.classList.add('gevuld');
        });
      }, 100));
    }

    async function volgendeStelling() {
      const volgIdx   = huidigeIndex + 1;
      const { error: ue } = await db.from('sessions')
        .update({ huidige_vraag_index: volgIdx }).eq('id', sessie.id);
      if (ue) { alert('Fout bij sessie-update: ' + ue.message); return; }
      const { error: sfe } = await db.from('poll_statements')
        .update({ status: 'active' }).eq('id', stellingen[volgIdx].id);
      if (sfe) { alert('Kon volgende stelling niet activeren: ' + sfe.message); return; }
      stellingen[volgIdx].status = 'active';
      sessie.huidige_vraag_index = volgIdx;
      huidigeIndex = volgIdx;
      toonStellingActief();
    }

    async function beeindigPoll() {
      const { error } = await db.from('sessions').update({ status: 'ended' }).eq('id', sessie.id);
      if (error) { alert('Kon sessie niet beëindigen: ' + error.message); return; }
      toonEinde();
    }

    function bevestigBeeindigen() {
      if (confirm('Weet je zeker dat je deze poll wilt beëindigen voor de hele klas?')) beeindigPoll();
    }

    // ── Eindscherm ────────────────────────────────────────────────────────────
    async function toonEinde() {
      if (huidigView === 'einde') return;
      huidigView = 'einde';
      if (antwoordKanaal) { db.removeChannel(antwoordKanaal); antwoordKanaal = null; }
      document.getElementById('stepper-outer').style.display = 'none';

      const samenvatting = await Promise.all(stellingen.map(async st => {
        const { data } = await db.from('poll_responses').select('score').eq('statement_id', st.id);
        const scores = (data || []).map(r => r.score).filter(s => s >= 1 && s <= 5);
        const gem = scores.length === 0 ? null : scores.reduce((a, b) => a + b, 0) / scores.length;
        return { tekst: st.tekst, gem, n: scores.length };
      }));

      app.innerHTML = `
        <div class="view">
          <div class="eind-hero">
            <div class="eind-eyebrow">Poll beëindigd · ${esc(lesTitel)}</div>
            <div class="eind-title">Goed gedaan, klas! 🎉</div>
            <div class="eind-sub">
              ${deelnemers.size} ${deelnemers.size === 1 ? 'leerling' : 'leerlingen'} namen deel ·
              ${stellingen.length} stellingen besproken
            </div>
          </div>

          <div class="samenvatting-kaart">
            <div class="sam-hoofd">
              <div>Stelling</div>
              <div>Verdeling (gemiddelde)</div>
              <div style="text-align:right">Score</div>
            </div>
            ${samenvatting.map((s, i) => {
              const kleur = gemiddeldeKleur(s.gem);
              const breedte = s.gem ? Math.round((s.gem / 5) * 100) : 0;
              return `
                <div class="sam-rij">
                  <div>
                    <div class="sam-stelling-nr">Stelling ${i + 1}</div>
                    <div class="sam-stelling-txt">${esc(s.tekst)}</div>
                    <div class="sam-n">${s.n} stemmen</div>
                  </div>
                  <div>
                    <div class="sam-balk-track">
                      <div class="sam-balk" id="sbalk-${i}" style="background:${kleur}"></div>
                    </div>
                    <div class="sam-emojis">
                      ${SCHAAL.map(sc => {
                        const isActief = s.gem && Math.abs(Math.round(s.gem) - sc.score) === 0;
                        return `<span style="font-size:${isActief ? '20px' : '14px'};opacity:${isActief ? '1' : '0.4'}">${sc.emoji}</span>`;
                      }).join('')}
                    </div>
                  </div>
                  <div class="sam-gem" style="color:${kleur}">${s.gem ? s.gem.toFixed(1) : '–'}</div>
                </div>`;
            }).join('')}
          </div>

          <div class="acties">
            <a class="btn btn-blue" href="../Dashboard/dashboard.html">← Terug naar dashboard</a>
          </div>
        </div>`;

      requestAnimationFrame(() => setTimeout(() => {
        samenvatting.forEach((s, i) => {
          const balk = document.getElementById(`sbalk-${i}`);
          if (balk && s.gem) balk.style.width = `${Math.round((s.gem / 5) * 100)}%`;
        });
      }, 200));
    }

    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = '/Inlogpagina/';
        return;
      }
      init();
    })();
  </script>
</body>
