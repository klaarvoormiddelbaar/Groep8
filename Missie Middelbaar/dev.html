<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Dev shortcut</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f2f6fd; flex-direction: column; gap: 12px; }
    button { padding: 12px 24px; font-size: 16px; border-radius: 9999px; border: none; cursor: pointer; background: #4e8ef3; color: #fff; font-weight: 700; }
    button:hover { background: #72a8f9; }
    p { font-size: 13px; color: #6d747a; }
  </style>
</head>
<body>
  <p id="status">Groepje aanmaken...</p>
  <script>
    const SUPABASE_URL      = 'https://cqcncausbclwvoomqdpy.supabase.co/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxY25jYXVzYmNsd3Zvb21xZHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MjE3MDYsImV4cCI6MjA5NjI5NzcwNn0.Yh-5xrjxPW36OOufxbgu8CGiemDofFQ4R59Mmeomlwo';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params  = new URLSearchParams(window.location.search);
    const missie  = params.get('m') || '2';
    const namen   = ['Dev', 'Test'];

    (async () => {
      const st = document.getElementById('status');
      try {
        const { data, error } = await db
          .from('missie_groepjes')
          .insert({ namen, missie_huidig: 1 })
          .select('id')
          .single();
        if (error) throw error;
        const doelMissie = parseInt(missie);
        if (doelMissie > 1) {
          await db.from('missie_groepjes').update({ missie_huidig: doelMissie }).eq('id', data.id);
        }
        sessionStorage.setItem('missie_groep_id', data.id);
        sessionStorage.setItem('missie_namen', JSON.stringify(namen));
        st.textContent = 'Doorsturen naar Missie ' + missie + '...';
        const fast = params.get('fast') === '1' ? '?fast=1' : '';
        window.location.href = 'missie-' + missie + '.html' + fast;
      } catch (e) {
        st.textContent = 'Fout: ' + e.message;
      }
    })();
  </script>
</body>
</html>
