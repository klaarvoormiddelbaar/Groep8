name: Website monitor

on:
  schedule:
    # Start at 03:00 local time; this leaves room for GitHub Actions queue
    # delays so the result is normally ready before the school day.
    - cron: '0 1 * 4-10 1-5'
    - cron: '0 2 * 1-3,11-12 1-5'
  workflow_dispatch:
    inputs:
      test_failure:
        description: 'Simuleer testmail voor Missie Middelbaar'
        required: false
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer website
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MONITOR_EMAIL: contact@klaarvoormiddelbaar.nl
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 output/website-monitor/cloud_monitor.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installeer browsercontrole
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Controleer ingelogde pagina’s
        env:
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MONITOR_EMAIL: contact@klaarvoormiddelbaar.nl
          TEST_FAILURE: ${{ inputs.test_failure }}
        run: node output/website-monitor/cloud_browser_monitor.mjs
