name: Website monitor

on:
  push:
    branches: [main]
  schedule:
    # 08:00 CEST (april–oktober) and 08:00 CET (november–maart).
    - cron: '0 6 * 4-10 1-5'
    - cron: '0 7 * 1-3,11-12 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer website
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MONITOR_EMAIL: contact@klaarvoormiddelbaar.nl
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 output/website-monitor/cloud_monitor.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installeer browsercontrole
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Controleer ingelogde pagina’s
        env:
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: node output/website-monitor/cloud_browser_monitor.mjs
