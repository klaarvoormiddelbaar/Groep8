name: Website monitor

on:
  schedule:
    # 08:00 CEST (april–oktober) and 08:00 CET (november–maart).
    - cron: '0 6 * 1-5 4-10'
    - cron: '0 7 * 1-5 1-3,11-12'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer website
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MONITOR_EMAIL: contact@klaarvoormiddelbaar.nl
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 output/website-monitor/cloud_monitor.py
