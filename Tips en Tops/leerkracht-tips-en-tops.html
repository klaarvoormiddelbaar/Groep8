<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tips en Tops — Overzicht leerkracht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --card-bg: #ffffff;
      --primary: #72a8f9;
      --primary-dark: #4e8ef3;
      --primary-soft: rgba(78,142,243,0.10);
      --green: #10a37f;
      --green-dark: #0c8268;
      --dark: #191c1d;
      --muted: #6d747a;
      --border: #eceeee;
      --shadow-card: 0 20px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.10);
      --max-w: 920px;
      --r-card: 32px;
      --r-pill: 9999px;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inria Sans', Georgia, serif;
      color: var(--dark);
      min-height: 100vh;
      background-color: #eef4fe;
      background-image:
        radial-gradient(ellipse at 10% -8%,  rgba(114,168,249,0.28) 0%, transparent 50%),
        radial-gradient(ellipse at 102% 105%, rgba(16,163,127,0.15)  0%, transparent 48%),
        radial-gradient(ellipse at 88% 4%,   rgba(251,191,36,0.13)   0%, transparent 40%);
      background-attachment: fixed;
    }

    .topbar { max-width: var(--max-w); margin: 0 auto; padding: 24px 24px 0; text-align: center; }
    .topbar img { height: 52px; width: auto; opacity: 0.92; }

    .main { max-width: var(--max-w); margin: 0 auto; padding: 24px 24px 80px; }

    .stats-rij { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat-kaart {
      flex: 1 1 160px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: var(--shadow-card); padding: 22px 24px;
    }
    .stat-label { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .stat-getal { font-size: 32px; font-weight: 700; color: var(--primary-dark); }

    @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

    .sectie {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); padding: 32px 36px; margin-bottom: 20px;
      animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    .sectie-titel { font-size: 18px; font-weight: 700; margin-bottom: 22px; }

    /* ── Rangschikking (balkgrafiek) ── */
    .chart { display: flex; flex-direction: column; gap: 16px; }
    .chart-rij { display: flex; align-items: center; gap: 16px; }
    .chart-rang {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary-soft); color: var(--primary-dark);
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .chart-lbl { width: 190px; flex-shrink: 0; font-size: 14px; font-weight: 700; color: var(--dark); line-height: 1.3; }
    .balk-track { flex: 1; height: 32px; background: #f0f2f5; border-radius: var(--r-pill); overflow: hidden; min-width: 0; }
    .balk {
      height: 100%; border-radius: var(--r-pill); width: 0%;
      background: var(--primary);
      transition: width 0.85s cubic-bezier(0.22,1,0.36,1);
      display: flex; align-items: center; padding: 0 12px; justify-content: flex-end;
    }
    .balk-pct { font-size: 12px; font-weight: 700; color: white; white-space: nowrap; }
    .chart-cnt { width: 76px; flex-shrink: 0; text-align: right; font-size: 13px; color: var(--muted); }

    /* ── Open antwoorden ── */
    .open-lijst { display: flex; flex-direction: column; gap: 10px; }
    .open-lijst.scrollbaar {
      max-height: 360px; overflow-y: auto;
      padding: 4px 4px 4px 0; margin: -4px -4px -4px 0;
    }
    .open-antwoord {
      position: relative;
      background: #f7f8f9; border: 1.5px solid var(--border); border-radius: 16px;
      padding: 14px 18px; font-size: 15px; line-height: 1.55; cursor: default;
      transition: border-color 0.15s, background 0.15s;
    }
    .open-antwoord:hover { border-color: var(--primary); background: var(--primary-soft); }
    .open-auteur {
      position: absolute; top: -13px; left: 14px;
      background: var(--primary-dark); color: white;
      font-size: 12px; font-weight: 700; line-height: 1;
      padding: 5px 12px; border-radius: var(--r-pill);
      box-shadow: 0 6px 14px rgba(78,142,243,0.35);
      opacity: 0; transform: translateY(4px);
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none; white-space: nowrap;
    }
    .open-antwoord:hover .open-auteur { opacity: 1; transform: translateY(0); }

    .leeg-kaart {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); padding: 56px 36px; text-align: center;
      color: var(--muted); font-size: 16px; line-height: 1.6;
    }
    .leeg-emoji { font-size: 40px; margin-bottom: 16px; }

    .laden-tekst { text-align: center; color: var(--muted); padding: 60px 0; font-size: 15px; }

    .terug-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: var(--primary-dark);
      text-decoration: none; margin-bottom: 20px;
    }
    .terug-link:hover { text-decoration: underline; }

    .ei { height: 1.15em; width: auto; object-fit: contain; vertical-align: -0.2em; display: inline-block; }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="/Dashboard/KvM%20logo%20no%20background.png" alt="Klaar voor Middelbaar">
  </div>

  <main class="main">
    <a class="terug-link" href="/tips-en-tops/leerkracht">← Terug naar de deel-link</a>

    <div class="stats-rij" id="stats-rij" style="display:none">
      <div class="stat-kaart">
        <div class="stat-label"><img class="ei" src="/Afbeeldingen/emojis nieuw/envelop.png" alt=""> Aantal reacties</div>
        <div class="stat-getal" id="stat-aantal">0</div>
      </div>
      <div class="stat-kaart">
        <div class="stat-label"><img class="ei" src="/Afbeeldingen/emojis nieuw/trofee.png" alt=""> Gemiddeld cijfer</div>
        <div class="stat-getal" id="stat-gemiddeld">–</div>
      </div>
    </div>

    <div id="lijst">
      <div class="laden-tekst">Reacties worden geladen…</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Tips%20en%20Tops/tips-en-tops-config.js"></script>
  <script>
    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }

    const ALLE_OPTIES = {
      meeste_aan_gehad: [
        'Slim leren',
        'Plannen en organiseren',
        'Omgaan met toetsen en stress',
        'Aantekeningen maken',
        'Omgaan met anderen',
        'Digitale vaardigheden'
      ],
      leukste_werkvormen: [
        'De opdrachten in het werkboek',
        'De opdrachten op de laptop',
        'De wordcloud',
        'De gesprekken met klasgenoten',
        'Het samenwerken in groepjes',
        'De quiz',
        'De poll / stellingen',
        'Het bespreken van voorbeelden uit het echte leven'
      ]
    };

    function telOp(reacties, veld) {
      const tellingen = new Map(ALLE_OPTIES[veld].map(optie => [optie, 0]));
      reacties.forEach(r => (r[veld] || []).forEach(optie => {
        tellingen.set(optie, (tellingen.get(optie) || 0) + 1);
      }));
      return [...tellingen.entries()].sort((a, b) => b[1] - a[1]);
    }

    function renderChart(titel, reacties, veld) {
      const rangschikking = telOp(reacties, veld);
      if (rangschikking.length === 0) return '';
      const max = Math.max(1, rangschikking[0][1]);

      return `
        <div class="sectie">
          <div class="sectie-titel">${escapeHtml(titel)}</div>
          <div class="chart">
            ${rangschikking.map(([optie, aantal], i) => `
              <div class="chart-rij">
                <div class="chart-rang">${i + 1}</div>
                <div class="chart-lbl">${escapeHtml(optie)}</div>
                <div class="balk-track">
                  <div class="balk" style="width:${Math.max(8, Math.round((aantal / max) * 100))}%">
                    <span class="balk-pct">${aantal}</span>
                  </div>
                </div>
                <div class="chart-cnt">${aantal} ${aantal === 1 ? 'leerling' : 'leerlingen'}</div>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function renderOpenVragen(titel, reacties, veld) {
      const antwoorden = reacties.filter(r => r[veld] && r[veld].trim());
      if (antwoorden.length === 0) return '';

      return `
        <div class="sectie">
          <div class="sectie-titel">${escapeHtml(titel)}</div>
          <div class="open-lijst${antwoorden.length > 5 ? ' scrollbaar' : ''}">
            ${antwoorden.map(r => `
              <div class="open-antwoord">
                <span class="open-auteur">${r.leerling_naam ? escapeHtml(r.leerling_naam) : 'Anoniem'}</span>
                ${escapeHtml(r[veld])}
              </div>`).join('')}
          </div>
        </div>`;
    }

    function renderReacties(reacties) {
      const lijst = document.getElementById('lijst');
      const statsRij = document.getElementById('stats-rij');

      if (reacties.length === 0) {
        statsRij.style.display = 'none';
        lijst.innerHTML = `
          <div class="leeg-kaart">
            <div class="leeg-emoji"><img class="ei" src="/Afbeeldingen/emojis nieuw/envelop.png" alt=""></div>
            Er zijn nog geen reacties binnengekomen.
          </div>`;
        return;
      }

      statsRij.style.display = 'flex';
      document.getElementById('stat-aantal').textContent = reacties.length;
      const gemiddeld = reacties.reduce((som, r) => som + r.cijfer, 0) / reacties.length;
      document.getElementById('stat-gemiddeld').textContent = gemiddeld.toFixed(1);

      lijst.innerHTML = [
        renderChart('Van welke onderwerpen heb je het meest geleerd?', reacties, 'meeste_aan_gehad'),
        renderOpenVragen('Wat mis je nog in het programma?', reacties, 'mist_nog'),
        renderChart('Welke werkvormen vond je het leukst?', reacties, 'leukste_werkvormen'),
        renderOpenVragen('Welke werkvormen vond je minder leuk, en wat kunnen we doen om ze leuker te maken?', reacties, 'saaiste_en_suggesties')
      ].join('');
    }

    let leerkrachtId = null;

    async function laadReacties() {
      const { data, error } = await db
        .from('tips_en_tops_reacties')
        .select('*')
        .eq('leerkracht_id', leerkrachtId)
        .order('ingediend_op', { ascending: false });

      if (error) {
        document.getElementById('lijst').innerHTML = `<div class="leeg-kaart">Kon reacties niet laden: ${escapeHtml(error.message)}</div>`;
        return;
      }
      renderReacties(data || []);
    }

    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = '/Inlogpagina/';
        return;
      }
      leerkrachtId = session.user.id;

      await laadReacties();

      db.channel('leerkracht-tips-en-tops')
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'tips_en_tops_reacties',
          filter: `leerkracht_id=eq.${leerkrachtId}`
        }, () => laadReacties())
        .subscribe();
    })();
  </script>
</body>
</html>
