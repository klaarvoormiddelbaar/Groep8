<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tips en Tops — Deel met je klas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --card-bg: #ffffff;
      --primary: #72a8f9;
      --primary-dark: #4e8ef3;
      --primary-soft: rgba(78,142,243,0.10);
      --green: #10a37f;
      --green-dark: #0c8268;
      --dark: #191c1d;
      --muted: #6d747a;
      --border: #eceeee;
      --shadow-card: 0 20px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.10);
      --shadow-btn-green: 0 10px 15px -3px rgba(0,0,0,0.18), 0 4px 6px -4px rgba(0,0,0,0.10);
      --max-w: 1184px;
      --r-card: 40px;
      --r-pill: 9999px;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inria Sans', Georgia, serif;
      color: var(--dark);
      min-height: 100vh;
      background-color: #eef4fe;
      background-image:
        radial-gradient(ellipse at 10% -8%,  rgba(114,168,249,0.28) 0%, transparent 50%),
        radial-gradient(ellipse at 102% 105%, rgba(16,163,127,0.15)  0%, transparent 48%),
        radial-gradient(ellipse at 88% 4%,   rgba(251,191,36,0.13)   0%, transparent 40%);
      background-attachment: fixed;
    }

    .topbar { max-width: var(--max-w); margin: 0 auto; padding: 24px 24px 0; text-align: center; }
    .topbar img { height: 52px; width: auto; opacity: 0.92; }

    .main { max-width: var(--max-w); margin: 0 auto; padding: 24px 24px 80px; }

    .lobby-hero {
      background: linear-gradient(135deg, #1a4280 0%, #3a7bd5 48%, #6aaaf8 78%, #9ac4fb 100%);
      border-radius: var(--r-card); padding: 52px 280px 52px 56px; color: white; min-height: 340px;
      position: relative; overflow: hidden; margin-bottom: 32px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .lobby-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.12) 1.5px, transparent 1.5px);
      background-size: 26px 26px; border-radius: inherit; pointer-events: none;
    }
    .lobby-hero::after {
      content: ''; position: absolute; top: -140px; right: -100px;
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .lobby-title {
      position: relative; font-size: 34px; font-weight: 700;
      margin-bottom: 30px; line-height: 1.3;
      display: flex; align-items: center; gap: 14px;
    }
    .lobby-title img { height: 1em; width: auto; }
    .lobby-jay {
      position: absolute; right: 68px; top: 50%; transform: translateY(-50%) scaleX(-1);
      height: 270px; width: auto; opacity: 0.96; pointer-events: none;
    }

    .lobby-step { position: relative; margin-bottom: 26px; }
    .lobby-step:last-child { margin-bottom: 0; }
    .lobby-step-label {
      display: flex; align-items: center; gap: 12px;
      font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.92); margin-bottom: 14px;
    }
    .lobby-step-num {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: white;
    }

    .join-pill {
      position: relative; display: inline-flex; align-items: center; gap: 16px;
      background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.32);
      border-radius: var(--r-pill); padding: 18px 28px;
      font-family: inherit; color: white; cursor: pointer; max-width: 100%;
      transition: background 0.18s, border-color 0.18s, transform 0.12s;
    }
    .join-pill:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.5); }
    .join-pill:active { transform: scale(0.97); }
    .join-pill:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    .join-pill-tekst {
      font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
      letter-spacing: 0.2px; overflow-wrap: anywhere; text-align: left;
    }
    .join-pill-icon { display: flex; flex-shrink: 0; color: rgba(255,255,255,0.85); transition: color 0.18s; }
    .join-pill-icon svg { width: 22px; height: 22px; }
    .join-pill.gekopieerd { background: rgba(16,163,127,0.32); border-color: rgba(16,163,127,0.6); }
    .join-pill.gekopieerd .join-pill-icon { color: #baf3d9; }

    .status-kaart {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); padding: 36px 36px; text-align: center;
    }
    .status-emoji { font-size: 44px; margin-bottom: 14px; }
    .status-tekst { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .status-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

    .namen-rij { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .naam-pil {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(16,163,127,0.1); border: 1px solid rgba(16,163,127,0.3);
      color: #065f46; font-size: 14px; font-weight: 700;
      border-radius: var(--r-pill); padding: 6px 14px;
    }

    .btn-antwoorden {
      display: inline-flex; align-items: center; gap: 10px;
      border: none; border-radius: var(--r-pill); cursor: pointer; text-decoration: none;
      font-family: inherit; font-size: 17px; font-weight: 700; color: white;
      background: var(--green); box-shadow: var(--shadow-btn-green);
      padding: 16px 32px;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s, background 0.2s;
    }
    .btn-antwoorden:hover { background: var(--green-dark); transform: translateY(-3px); box-shadow: 0 18px 30px rgba(16,163,127,0.34); }

    .terug-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: var(--muted);
      text-decoration: none; margin-top: 18px;
    }
    .terug-link:hover { color: var(--primary-dark); }
    .btn-pijl { transition: transform 0.2s; }
    .btn-antwoorden:hover .btn-pijl { transform: translateX(4px); }

    .ei { height: 1.15em; width: auto; object-fit: contain; vertical-align: -0.2em; display: inline-block; }

    @media (max-width: 720px) {
      .lobby-hero { padding: 32px 24px; min-height: 0; }
      .lobby-jay { display: none; }
    }
    @media (max-width: 480px) {
      .lobby-hero, .status-kaart { padding: 28px 24px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="/Dashboard/KvM%20logo%20no%20background.png" alt="Klaar voor Middelbaar">
  </div>

  <main class="main">
    <div class="lobby-hero" id="link-kaart" style="display:none">
      <div class="lobby-title"><img src="/Afbeeldingen/emojis nieuw/lamp.png" alt="">Tips en Tops</div>
      <div class="lobby-step">
        <div class="lobby-step-label"><span class="lobby-step-num">1</span> Ga naar de link</div>
        <button class="join-pill" type="button" id="join-pill" onclick="kopieerJoinLink(leerlingLink)">
          <span class="join-pill-tekst" id="link-url">…</span>
          <span class="join-pill-icon" id="join-pill-icon"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="7" width="10" height="10" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M13 7V5.5A2.5 2.5 0 0 0 10.5 3H5.5A2.5 2.5 0 0 0 3 5.5v5A2.5 2.5 0 0 0 5.5 13H7" stroke="currentColor" stroke-width="1.6"/></svg></span>
        </button>
      </div>
      <div class="lobby-step">
        <div class="lobby-step-label"><span class="lobby-step-num">2</span> Vul daar de enquête in</div>
      </div>
      <img class="lobby-jay" src="/Afbeeldingen/Jay%20los/Jay%20waving.png" alt="Jay">
    </div>

    <div class="status-kaart">
      <div class="status-emoji" id="status-emoji"><img class="ei" style="height:1em" src="/Afbeeldingen/emojis nieuw/raket.png" alt=""></div>
      <div class="status-tekst" id="status-tekst">Even kijken…</div>
      <div class="status-sub" id="status-sub">&nbsp;</div>
      <div class="namen-rij" id="namen-rij"></div>
      <a class="btn-antwoorden" href="/tips-en-tops/leerkracht/antwoorden">
        Naar antwoorden <span class="btn-pijl">→</span>
      </a>
      <div>
        <a class="terug-link" href="/les8" onclick="terugNaarLes(event)">← Terug naar les 8</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Tips%20en%20Tops/tips-en-tops-config.js"></script>
  <script>
    let leerkrachtId = null;
    let leerlingLink = '';

    const ICOON_KOPIEER = `<svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="7" width="10" height="10" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M13 7V5.5A2.5 2.5 0 0 0 10.5 3H5.5A2.5 2.5 0 0 0 3 5.5v5A2.5 2.5 0 0 0 5.5 13H7" stroke="currentColor" stroke-width="1.6"/></svg>`;
    const ICOON_GEKOPIEERD = `<svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10.5L8 14.5L16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    let kopieerTimeoutId = null;

    // Sluit dit tabblad (terug naar de presentatie-tab die het opende); lukt dat niet, navigeer dan gewoon door.
    function terugNaarLes(e) {
      e.preventDefault();
      const url = e.currentTarget.href;
      window.close();
      setTimeout(() => { window.location.href = url; }, 150);
    }

    function kopieerJoinLink(url) {
      try { navigator.clipboard.writeText(url); } catch (fout) {}

      const pill = document.getElementById('join-pill');
      const tekst = document.getElementById('link-url');
      const icoon = document.getElementById('join-pill-icon');
      if (!pill || !tekst || !icoon) return;

      const origineleTekst = tekst.textContent;
      pill.classList.add('gekopieerd');
      tekst.textContent = 'Gekopieerd naar klembord';
      icoon.innerHTML = ICOON_GEKOPIEERD;

      if (kopieerTimeoutId) clearTimeout(kopieerTimeoutId);
      kopieerTimeoutId = setTimeout(() => {
        pill.classList.remove('gekopieerd');
        tekst.textContent = origineleTekst;
        icoon.innerHTML = ICOON_KOPIEER;
      }, 1800);
    }

    async function haalOfMaakLink() {
      const { data: bestaand } = await db
        .from('tips_en_tops_links')
        .select('code')
        .eq('leerkracht_id', leerkrachtId)
        .maybeSingle();

      let code = bestaand && bestaand.code;

      if (!code) {
        const { data: nieuw, error } = await db
          .from('tips_en_tops_links')
          .insert({ leerkracht_id: leerkrachtId })
          .select('code')
          .single();
        if (!error) code = nieuw.code;
      }

      if (!code) return;

      const url = `groep8.klaarvoormiddelbaar.nl/feedback/${code}`;
      leerlingLink = `https://${url}`;
      document.getElementById('link-url').textContent = url;
      document.getElementById('link-kaart').style.display = 'block';
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }

    async function verversStatus() {
      const { data, error } = await db
        .from('tips_en_tops_reacties')
        .select('leerling_naam')
        .eq('leerkracht_id', leerkrachtId)
        .order('ingediend_op', { ascending: false });

      const emojiEl = document.getElementById('status-emoji');
      const tekstEl = document.getElementById('status-tekst');
      const subEl   = document.getElementById('status-sub');
      const namenEl = document.getElementById('namen-rij');

      if (error) {
        emojiEl.innerHTML = '<img class="ei" style="height:1em" src="/Afbeeldingen/emojis nieuw/vraagteken.png" alt="">';
        tekstEl.textContent = 'Kon de status niet ophalen';
        subEl.textContent = 'Probeer de pagina opnieuw te laden.';
        namenEl.innerHTML = '';
        return;
      }

      const aantal = data.length;

      if (!aantal) {
        emojiEl.innerHTML = '<img class="ei" style="height:1em" src="/Afbeeldingen/emojis nieuw/raket.png" alt="">';
        tekstEl.textContent = 'Nog niemand heeft de enquête ingeleverd';
        subEl.textContent = 'Deel de link hierboven met je klas om te beginnen.';
        namenEl.innerHTML = '';
      } else {
        emojiEl.innerHTML = '<img class="ei" style="height:1em" src="/Afbeeldingen/emojis nieuw/trofee.png" alt="">';
        tekstEl.textContent = `${aantal} ${aantal === 1 ? 'leerling heeft' : 'leerlingen hebben'} de enquête al ingeleverd`;
        subEl.textContent = 'Bekijk de antwoorden zodra je klaar bent om te bespreken.';
        namenEl.innerHTML = data
          .map(r => r.leerling_naam ? r.leerling_naam.trim() : null)
          .filter(Boolean)
          .map(naam => `<span class="naam-pil"><img class="ei" src="/Afbeeldingen/emojis nieuw/vinkje.png" alt=""> ${escapeHtml(naam)}</span>`)
          .join('');
      }
    }

    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = '/Inlogpagina/';
        return;
      }
      leerkrachtId = session.user.id;

      await haalOfMaakLink();
      await verversStatus();

      db.channel('leerkracht-deel-link')
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'tips_en_tops_reacties',
          filter: `leerkracht_id=eq.${leerkrachtId}`
        }, () => verversStatus())
        .subscribe();
    })();
  </script>
</body>
</html>
